<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Configurações — Vai de Rural</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Baloo+2:wght@400..800&display=swap" rel="stylesheet">
<style>
/* Tela Configurações (configuracoes/editor.js): formulários para a produção editar textos, fotos e vídeos. */
:root {
  --anil: #1f2a6b; --noite: #151d4d; --fundo: #0e1440; --sol: #ffc21a; --rosa: #ff5c9a; --verde: #1f9d62; --vermelho: #e8452c;
  --texto: #fff; --texto-2: #c9cef0; --campo: #fff; --campo-texto: #1a1f3d; --borda: rgba(255, 255, 255, .22);
  --vidro: rgba(255, 255, 255, .06); --raio: 14px;
  --display: "Alfa Slab One", Georgia, serif; --corpo: "Baloo 2", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fundo); color: var(--texto); font: 400 1.05rem/1.5 var(--corpo); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: var(--sol); }
button, input, textarea, select { font: inherit; }
:focus-visible { outline: 3px solid var(--sol); outline-offset: 2px; }

/* Topo fixo: situação, Publicar e as abas */
.topo { position: sticky; top: 0; z-index: 20; background: var(--anil); border-bottom: 4px solid var(--rosa); padding: .6rem 16px 0; box-shadow: 0 6px 20px rgba(0, 0, 0, .35); }
.topo__linha { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem 1rem; max-width: 980px; margin: 0 auto; }
.marca { font-family: var(--display); color: var(--sol); text-decoration: none; font-size: 1.3rem; }
.topo__titulo { font-weight: 800; font-size: 1.1rem; }
.situacao { margin-left: auto; font-size: .9rem; color: #b8f0d2; font-weight: 700; }
.situacao::before { content: "● "; }
.situacao--pendente { color: var(--sol); }
.topo__acoes { display: flex; flex-wrap: wrap; gap: .5rem; max-width: 980px; margin: .5rem auto 0; }
.abas { display: flex; gap: .3rem; overflow-x: auto; max-width: 980px; margin: .6rem auto 0; scrollbar-width: none; }
.abas::-webkit-scrollbar { display: none; }
.aba { flex: none; background: none; border: 0; color: var(--texto-2); padding: .45rem .8rem .55rem; border-radius: 10px 10px 0 0; font-weight: 700; cursor: pointer; }
.aba[aria-current="true"] { background: var(--fundo); color: #fff; }

/* Botões */
.botao { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: .45rem 1.1rem; border-radius: 999px;
  border: 2px solid var(--sol); background: var(--sol); color: var(--anil); font-weight: 800; cursor: pointer; text-decoration: none; }
.botao--claro { background: transparent; color: #fff; border-color: var(--borda); }
.botao--claro:hover { border-color: #fff; }
.botao--publicar { background: var(--verde); border-color: var(--verde); color: #fff; }
.botao--publicar:disabled { background: transparent; border-color: var(--borda); color: var(--texto-2); cursor: default; }
.botao--texto { background: none; border-color: transparent; color: var(--texto-2); font-weight: 600; text-decoration: underline; }
.icone { width: 40px; height: 40px; flex: none; border-radius: 10px; border: 1px solid var(--borda); background: var(--vidro); color: #fff; cursor: pointer; font-size: 1.1rem; }
.icone:disabled { opacity: .3; cursor: default; }
.icone--apagar:hover { background: var(--vermelho); border-color: var(--vermelho); }
.link { color: var(--sol); font-weight: 700; }

/* Painel */
#painel { max-width: 980px; margin: 0 auto; padding: 1.4rem 16px 4rem; }
.intro { color: var(--texto-2); margin: 0 0 1.4rem; max-width: 65ch; }
.campo { margin: 0 0 1.2rem; }
.campo label, .grupo legend { display: block; font-weight: 800; margin-bottom: .3rem; }
.dica { margin: -.1rem 0 .5rem; font-size: .9rem; color: var(--texto-2); }
input[type="text"], input[type="email"], input[type="url"], input[type="password"], textarea, select {
  width: 100%; background: var(--campo); color: var(--campo-texto); border: 2px solid transparent; border-radius: 10px; padding: .55rem .75rem; line-height: 1.45; }
textarea { resize: vertical; min-height: 4.5rem; }
input:focus, textarea:focus, select:focus { border-color: var(--sol); outline: none; }
input[type="color"] { width: 64px; height: 44px; border: 0; background: none; padding: 0; cursor: pointer; }
.campo--curto select { width: auto; min-width: 12rem; }
.campo--marcar { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
.campo--marcar input { width: 22px; height: 22px; accent-color: var(--sol); }
.campo--marcar label { margin: 0; font-weight: 600; }
.campo--marcar .dica { flex-basis: 100%; margin: 0; }
.grupo { border: 1px solid var(--borda); border-radius: var(--raio); padding: .9rem 1rem 1rem; margin: 0 0 1.4rem; background: var(--vidro); min-width: 0; }
.grupo legend { padding: 0 .4rem; font-size: 1.1rem; }
.linha { display: flex; gap: .5rem; align-items: flex-start; margin-bottom: .6rem; }
.linha > input, .linha > textarea, .linha .par { flex: 1; min-width: 0; }
.controles { display: flex; gap: .3rem; flex: none; }
.par { display: grid; gap: .4rem; grid-template-columns: 1fr 1fr; }
.par:has(textarea) { grid-template-columns: 1fr; }
.sub { border-top: 1px solid var(--borda); padding-top: .8rem; margin-top: .4rem; }
.sub:first-of-type { border-top: 0; padding-top: 0; }
.duas { display: grid; gap: 0 1rem; grid-template-columns: 2fr 1fr; }
.acoes { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .4rem; }
.arquivo label { cursor: pointer; }
.arquivo input:focus-visible + label { outline: 3px solid var(--sol); outline-offset: 2px; }
.vazio { color: var(--texto-2); font-style: italic; margin: 0 0 .6rem; }
.selo { position: absolute; top: 6px; left: 6px; background: var(--verde); color: #fff; font-size: .75rem; font-weight: 800; padding: 0 .5rem; border-radius: 999px; }
.selo--leve { position: static; background: rgba(255, 255, 255, .15); }

/* Fotos */
.fotos { list-style: none; margin: 0 0 .8rem; padding: 0; display: grid; gap: .9rem; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.foto { display: flex; flex-direction: column; gap: .4rem; }
.foto__img { position: relative; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; background: rgba(0, 0, 0, .3); }
.foto__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto--unica { max-width: 240px; margin-bottom: .6rem; }
.foto--unica .foto__img { aspect-ratio: auto; }
.foto--unica .foto__img img { height: auto; object-fit: contain; }
.foto textarea { min-height: 3rem; font-size: .95rem; }
.foto .campo { margin: 0; }
.foto .campo label { font-size: .85rem; margin-bottom: .1rem; }
.foto .campo--curto select { min-width: 0; width: 100%; }
.foto .controles { justify-content: flex-end; }

/* Edições */
.chips { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 1.2rem; }
.chip { min-height: 44px; padding: .3rem 1rem; border-radius: 999px; border: 2px solid var(--c, var(--borda)); background: transparent; color: #fff; font-weight: 800; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--c); box-shadow: 0 0 0 3px var(--fundo), 0 0 0 5px #fff; }
.chip--novo { border-style: dashed; border-color: var(--borda); color: var(--texto-2); }
.titulo-ed { font-family: var(--display); font-weight: 400; font-size: 1.8rem; margin: 0 0 1rem; }

/* Vídeos */
.novo-video .linha { margin: 0; }
.videos { list-style: none; margin: 1.4rem 0 0; padding: 0; display: grid; gap: 1rem; }
.video { display: grid; grid-template-columns: 200px 1fr auto; gap: 1rem; align-items: start; padding: .9rem; border: 1px solid var(--borda); border-radius: var(--raio); background: var(--vidro); }
.video img { width: 100%; border-radius: 8px; display: block; }
.video .campo { margin-bottom: .6rem; }

/* Cartões (artistas, equipe, comunidades) */
details.cartao { border: 1px solid var(--borda); border-radius: var(--raio); background: var(--vidro); margin-bottom: .8rem; }
details.cartao > summary { display: flex; align-items: center; gap: .8rem; padding: .6rem .8rem; cursor: pointer; list-style: none; }
details.cartao > summary::-webkit-details-marker { display: none; }
details.cartao > summary::before { content: "▸"; color: var(--sol); transition: rotate .15s; }
details.cartao[open] > summary::before { rotate: 90deg; }
details.cartao > summary img, .sem-foto { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex: none; background: rgba(0, 0, 0, .3); }
details.cartao > summary strong { flex: 1; min-width: 0; }
.cartao__corpo { padding: .4rem 1rem 1rem; border-top: 1px solid var(--borda); }
.linha--funcao { align-items: center; }
.linha--funcao .campo { margin: 0; }
.linha--funcao .campo label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.linha--funcao .campo--curto select { min-width: 9.5rem; }

/* Escolher fotos do site */
.escolher { width: min(960px, 100vw - 16px); max-height: 90vh; padding: 0; border: 0; border-radius: var(--raio); background: var(--noite); color: #fff; display: flex; flex-direction: column; }
.escolher:not([open]) { display: none; }
.escolher::backdrop { background: rgba(5, 8, 25, .75); }
.escolher__topo, .escolher__base { display: flex; align-items: center; justify-content: space-between; padding: .8rem 1rem; background: var(--anil); }
.escolher__topo h2 { margin: 0; font-size: 1.2rem; }
.escolher__lista { overflow: auto; padding: 0 1rem 1rem; }
.escolher__lista h3 { margin: 1rem 0 .5rem; }
.escolher__fotos { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
.escolher__foto { padding: 0; border: 3px solid transparent; border-radius: 10px; overflow: hidden; cursor: pointer; aspect-ratio: 1; background: rgba(0, 0, 0, .3); }
.escolher__foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.escolher__foto[aria-pressed="true"] { border-color: var(--sol); box-shadow: 0 0 0 3px var(--sol); }
.escolher__base { justify-content: flex-end; }

/* Avisos e progresso */
#avisos { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; z-index: 50; display: grid; gap: .5rem; width: min(560px, 100vw - 32px); }
.aviso { display: flex; align-items: center; gap: .6rem; padding: .7rem 1rem; border-radius: 12px; background: var(--anil); border: 2px solid var(--sol); box-shadow: 0 10px 28px rgba(0, 0, 0, .45); font-weight: 600; }
.aviso--erro { border-color: var(--vermelho); background: #4a1420; }
.aviso--ok { border-color: var(--verde); background: #0f3b2a; }
.aviso a { color: var(--sol); }
.aviso__fechar { margin-left: auto; background: none; border: 0; color: #fff; font-size: 1.4rem; cursor: pointer; line-height: 1; }
.entrada .aviso { position: static; box-shadow: none; }
#progresso { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(5, 8, 25, .6); }
#progresso[hidden] { display: none; }
.progresso__caixa { display: flex; align-items: center; gap: .8rem; background: var(--anil); padding: 1rem 1.4rem; border-radius: var(--raio); font-weight: 700; border: 2px solid var(--sol); }
.progresso__roda { width: 26px; height: 26px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .25); border-top-color: var(--sol); animation: gira .8s linear infinite; }
@keyframes gira { to { rotate: 360deg; } }

/* Entrada (chave de acesso) */
.entrada { max-width: 480px; margin: 12vh auto; padding: 0 16px; }
.entrada h1 { font-family: var(--display); font-weight: 400; color: var(--sol); font-size: 2rem; line-height: 1.15; }
.entrada p { color: var(--texto-2); }
.entrada form { display: grid; gap: .6rem; margin: 1.4rem 0; }
.entrada label { font-weight: 800; }
.pe { max-width: 980px; margin: 0 auto; padding: 0 16px 6rem; }

@media (max-width: 640px) {
  .duas { grid-template-columns: 1fr; }
  .par { grid-template-columns: 1fr; }
  .video { grid-template-columns: 1fr; }
  .video img { max-width: 260px; }
  .video .controles { justify-content: flex-end; }
  .fotos { grid-template-columns: 1fr 1fr; gap: .7rem; }
  .linha { flex-direction: column; align-items: stretch; }
  .linha .controles { justify-content: flex-end; }
  .linha--funcao { flex-direction: row; flex-wrap: wrap; }
  .linha--funcao input { flex: 1 1 100%; order: 3; }
  .topo__acoes .botao { flex: 1; }
  .topo__acoes .botao--texto { flex-basis: 100%; min-height: 32px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="avisos" aria-live="polite"></div>
<div id="progresso" hidden><div class="progresso__caixa"><span class="progresso__roda" aria-hidden="true"></span><span class="progresso__texto" role="status"></span></div></div>
<noscript><p style="padding:2rem">A tela Configurações precisa de JavaScript ligado.</p></noscript>
<script type="module" src="configuracoes/editor.js"></script>
</body>
</html>
