<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vai de Rural · 7ª Mostra Audiovisual Itinerante</title>
<meta name="description" content="Fotolivro da 7ª edição do Vai de Rural, mostra audiovisual itinerante na Comunidade Quilombola do Baixão, Vitória da Conquista (BA).">
<meta name="theme-color" content="#1d1510">
<meta property="og:type" content="website">
<meta property="og:title" content="Vai de Rural · 7ª Mostra Audiovisual Itinerante">
<meta property="og:description" content="É no pé do morro, é lá no cafundó. O fotolivro da mostra que leva cinema e circo ao sertão baiano.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Vai de Rural — fotolivro digital
   Um livro de capa dura em tecido anil, título em dourado, sobre uma mesa
   iluminada. Tipografia única (EB Garamond) usada como num livro impresso:
   capitular, versaletes, sumário com pontilhado, fólios e cabeços.
   Tudo dentro da página é dimensionado em unidades de container (cqw),
   então a diagramação é idêntica em qualquer tamanho de tela.
   ========================================================================== */
:root {
  --mesa-luz: #3b2c22;
  --mesa: #1d1510;
  --mesa-fundo: #110c09;
  --anil: #1f2b48;
  --anil-escuro: #151e35;
  --ouro: #c9a664;
  --papel: #f1ede4;
  --papel-sombra: #ddd6c8;
  --tinta: #221e1a;
  --tinta-suave: #6d655a;
  --guarda: #2c5f5b;
  --fita: #9a3a2b;
  --texto-mesa: #e9e0cf;

  --serifa: "EB Garamond", Garamond, "Times New Roman", serif;
  --virar: 1.1s;
  --curva: cubic-bezier(.45, .05, .2, 1);

  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--serifa);
  color: var(--texto-mesa);
  background:
    radial-gradient(ellipse 65% 60% at 50% 46%, var(--mesa-luz) 0%, var(--mesa) 58%, var(--mesa-fundo) 100%);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  font-kerning: normal;
}
button { font: inherit; color: inherit; }
img { display: block; max-width: none; }
:focus-visible { outline: 2px solid var(--ouro); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Mesa e dimensões do livro ---------- */
.mesa {
  --razao: .78;                       /* largura/altura da página */
  --pag-h: min(calc(100svh - 9.5rem), calc((100vw - 7rem) / 2 / var(--razao)), 900px);
  --pag-w: calc(var(--pag-h) * var(--razao));
  height: 100svh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
@media (max-width: 820px) {
  .mesa {
    --razao: .6;
    --pag-w: min(calc(100vw - 2.5rem), calc((100svh - 9rem) * var(--razao)));
    --pag-h: calc(var(--pag-w) / var(--razao));
  }
}

.topo {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 1.1rem clamp(1.25rem, 4vw, 3rem) 0;
  font-variant-caps: all-small-caps; letter-spacing: .08em;
  color: rgb(233 224 207 / .55); font-size: 1.05rem;
}
.topo strong { font-weight: 500; color: rgb(233 224 207 / .85); }

.palco {
  display: grid; place-items: center; min-height: 0;
  overflow: hidden; touch-action: pan-y;
  user-select: none; -webkit-user-select: none;
}

.livro {
  position: relative;
  width: calc(var(--pag-w) * 2);
  height: var(--pag-h);
  perspective: calc(var(--pag-w) * 5);
  transition: transform .9s var(--curva);
  animation: chegar 1.2s var(--curva) both;
}
.livro.is-fechado { transform: translateX(calc(var(--pag-w) / -2)); }
.livro.is-final   { transform: translateX(calc(var(--pag-w) / 2)); }
.mesa.is-simples .livro { width: var(--pag-w); transform: none; }
@keyframes chegar { from { opacity: 0; translate: 0 18px; } }

/* sombra do livro na mesa + espessura dos blocos de páginas */
.livro::before, .livro::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: var(--pag-w);
  background: var(--papel-sombra);
  transition: opacity .4s;
}
.livro::before {
  left: 0; border-radius: 4px 0 0 4px;
  box-shadow: -2px 2px 0 #e4ddcf, -4px 3px 0 #d3cbbb, -6px 4px 0 #c6bdab, -18px 30px 50px rgb(0 0 0 / .55);
}
.livro::after {
  right: 0; border-radius: 0 4px 4px 0;
  box-shadow: 2px 2px 0 #e4ddcf, 4px 3px 0 #d3cbbb, 6px 4px 0 #c6bdab, 18px 30px 50px rgb(0 0 0 / .55);
}
.livro.is-fechado::before, .livro.is-final::after { opacity: 0; }
.mesa.is-simples .livro::before { display: none; }

/* fita marcadora, no vinco do livro aberto */
.fita {
  position: absolute; z-index: 400; left: calc(50% - 5px); top: -4px;
  width: 10px; height: calc(100% + 2.6rem);
  background: linear-gradient(90deg, #7d2c20, var(--fita) 40%, #b0493a 60%, #7d2c20);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 9px), 0 100%);
  pointer-events: none; transition: opacity .4s;
}
.livro.is-fechado .fita, .livro.is-final .fita, .mesa.is-simples .fita { opacity: 0; }

/* ---------- Folhas ---------- */
.folha {
  position: absolute; top: 0; left: 50%;
  width: var(--pag-w); height: 100%;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform var(--virar) var(--curva), opacity .3s;
}
.mesa.is-simples .folha { left: 0; }
.folha.is-virada { transform: rotateY(-180deg); }
.mesa.is-simples .folha.is-virada { opacity: 0; transition: transform var(--virar) var(--curva), opacity .25s calc(var(--virar) * .7); }

.face {
  position: absolute; inset: 0; overflow: hidden;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--papel);
}
.face--verso { transform: rotateY(180deg); }
.face--frente { border-radius: 0 3px 3px 0; }
.face--verso  { border-radius: 3px 0 0 3px; }
/* luz passando pela folha enquanto ela vira */
.face::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(90deg, rgb(0 0 0 / .28), rgb(255 255 255 / .06) 60%, rgb(0 0 0 / .1));
}
.folha.is-movendo .face::after { animation: luz var(--virar) var(--curva); }
@keyframes luz { 0%, 100% { opacity: 0; } 45% { opacity: 1; } }

/* ---------- Página (base) ---------- */
.pagina {
  position: absolute; inset: 0; container-type: size;
  color: var(--tinta);
  font-size: clamp(12.5px, 3.35cqw, 22px);
  line-height: 1.45;
  hyphens: auto; -webkit-hyphens: auto;
}
/* sombra do vinco (lado de dentro) */
.pagina--dir::before, .pagina--esq::before {
  content: ""; position: absolute; top: 0; bottom: 0; width: 9%; z-index: 3; pointer-events: none;
}
.pagina--dir::before { left: 0;  background: linear-gradient(90deg, rgb(40 25 10 / .22), transparent); }
.pagina--esq::before { right: 0; background: linear-gradient(270deg, rgb(40 25 10 / .22), transparent); }
.mesa.is-simples .pagina--dir::before { width: 4%; opacity: .6; }

.cabeco, .folio {
  position: absolute; z-index: 2;
  font-variant-caps: all-small-caps; letter-spacing: .09em;
  font-size: max(10.5px, 2.5cqw); color: var(--tinta-suave);
  font-variant-numeric: oldstyle-nums;
}
.cabeco { top: 5.5cqw; }
.folio  { bottom: 5cqw; }
.pagina--dir .cabeco, .pagina--dir .folio { right: 8cqw; }
.pagina--esq .cabeco, .pagina--esq .folio { left: 8cqw; }
.folio--claro { color: rgb(255 255 255 / .8); text-shadow: 0 1px 3px rgb(0 0 0 / .5); }

.miolo { position: absolute; inset: 14cqw 10cqw 13cqw; display: flex; flex-direction: column; }

.h-livro {
  font-weight: 500; font-size: 8.4cqw; line-height: 1.02; letter-spacing: -.01em;
  margin: 0 0 1.1em; text-wrap: balance;
}
.pagina p { margin: 0; }
.corpo p { text-align: justify; text-indent: 1.4em; }
.corpo p:first-child { text-indent: 0; }
.corpo p:first-child::first-letter {
  float: left; font-size: 3.55em; line-height: .82; margin: .06em .08em 0 0; font-weight: 500; color: var(--fita);
}

/* fotos clicáveis */
.zoom {
  display: block; width: 100%; height: 100%; padding: 0; border: 0; margin: 0;
  background: #d8d1c2; cursor: zoom-in; overflow: hidden; position: relative;
}
.zoom img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s; }
.zoom img.is-carregada { opacity: 1; }

/* ---------- Capa e contracapa (tecido) ---------- */
.tecido {
  position: absolute; inset: 0;
  background-color: var(--anil);
  background-image:
    linear-gradient(90deg, transparent 4.2%, rgb(0 0 0 / .35) 4.6%, rgb(255 255 255 / .07) 5.1%, transparent 5.6%),
    radial-gradient(ellipse at 28% 18%, rgb(255 255 255 / .09), transparent 60%),
    repeating-linear-gradient(0deg, rgb(255 255 255 / .028) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgb(0 0 0 / .07) 0 1px, transparent 1px 3px);
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .25), inset 0 0 40px rgb(0 0 0 / .35);
  color: var(--ouro);
}
.contracapa.tecido {
  background-image:
    linear-gradient(270deg, transparent 4.2%, rgb(0 0 0 / .35) 4.6%, rgb(255 255 255 / .07) 5.1%, transparent 5.6%),
    radial-gradient(ellipse at 70% 18%, rgb(255 255 255 / .07), transparent 60%),
    repeating-linear-gradient(0deg, rgb(255 255 255 / .028) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgb(0 0 0 / .07) 0 1px, transparent 1px 3px);
}
/* dourado a quente, levemente afundado no tecido */
.ouro {
  background: linear-gradient(170deg, #e6cd92 10%, #b88f45 45%, #d9bc7a 60%, #a07a36 90%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 -1px 0 rgb(0 0 0 / .45)) drop-shadow(0 1px 0 rgb(255 255 255 / .08));
}
.capa {
  display: grid; grid-template-rows: auto 1fr auto auto; justify-items: center;
  padding: 11cqw 12cqw 10cqw 15cqw; text-align: center;
}
.capa__sobre {
  font-variant-caps: all-small-caps; letter-spacing: .22em; font-size: 3.4cqw;
}
.capa__foto {
  align-self: center; width: 100%; aspect-ratio: 4 / 3; margin: 6cqw 0;
  padding: 1.6cqw; background: #f4f0e8;
  box-shadow: 0 1px 0 rgb(255 255 255 / .1), 0 3px 10px rgb(0 0 0 / .45), inset 0 0 0 1px rgb(0 0 0 / .08);
}
.capa__foto .zoom { cursor: inherit; pointer-events: none; }
.capa__titulo { margin: 0; font-weight: 500; font-size: 15.5cqw; line-height: .95; letter-spacing: -.01em; }
.capa__ed { margin-top: 3.2cqw; font-style: italic; font-size: 4.4cqw; }

.contracapa { display: grid; place-content: center; text-align: center; gap: 3cqw; padding: 12cqw 15cqw 12cqw 12cqw; }
.contracapa__marca { font-weight: 500; font-size: 8cqw; }
.contracapa__lema { font-style: italic; font-size: 4.2cqw; line-height: 1.35; }
.contracapa__fino { margin-top: 8cqw; font-variant-caps: all-small-caps; letter-spacing: .14em; font-size: 3cqw; }

/* ---------- Guardas ---------- */
.guarda {
  position: absolute; inset: 0; background-color: var(--guarda);
  background-image:
    radial-gradient(circle at 50% 50%, rgb(255 255 255 / .09) 0 1.2px, transparent 1.6px),
    repeating-linear-gradient(45deg, rgb(0 0 0 / .05) 0 1px, transparent 1px 6px);
  background-size: 4.2cqw 4.2cqw, auto;
}

/* ---------- Folha de rosto ---------- */
.rosto { position: absolute; inset: 16cqw 11cqw 13cqw; display: grid; grid-template-rows: auto 1fr auto; text-align: center; }
.rosto__lema { font-style: italic; color: var(--tinta-suave); font-size: 4cqw; line-height: 1.35; }
.rosto__bloco { align-self: center; }
.rosto__titulo { margin: 0; font-weight: 500; font-size: 13cqw; line-height: 1; }
.rosto__fio { width: 14cqw; height: 1px; background: var(--tinta); margin: 5cqw auto; opacity: .6; }
.rosto__sub { font-variant-caps: all-small-caps; letter-spacing: .16em; font-size: 4cqw; }
.rosto__ed { font-style: italic; font-size: 4.6cqw; margin-top: 1.5cqw !important; }
.rosto__pe { font-size: 3.3cqw; line-height: 1.5; color: var(--tinta-suave); }

/* ---------- Sumário ---------- */
.sumario ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2.4cqw; }
.sumario button {
  width: 100%; display: flex; align-items: baseline; gap: .5em;
  background: none; border: 0; padding: .35em 0; cursor: pointer; text-align: left;
  color: var(--tinta); font-size: 1.08em;
}
.sumario button:hover .sumario__rotulo { color: var(--fita); }
.sumario__num { font-variant-caps: all-small-caps; letter-spacing: .06em; min-width: 1.6em; color: var(--tinta-suave); }
.sumario__pontos { flex: 1; border-bottom: 1.5px dotted rgb(34 30 26 / .35); translate: 0 -.3em; min-width: 1em; }
.sumario__pag { font-variant-numeric: oldstyle-nums; }

/* ---------- Abertura de capítulo ---------- */
.capitulo { position: absolute; inset: 0; display: grid; align-content: center; padding: 0 12cqw; }
.capitulo__num { font-size: 26cqw; line-height: .8; font-weight: 400; color: var(--fita); }
.capitulo h2 { margin: 3cqw 0 0; font-weight: 500; font-size: 11cqw; line-height: 1; }
.capitulo__fio { width: 12cqw; height: 1px; background: var(--tinta); opacity: .5; margin: 6cqw 0 5cqw; }
.capitulo__sub { font-size: 4.2cqw; line-height: 1.5; color: var(--tinta-suave); }
.capitulo__sub em { color: var(--tinta); }

/* ---------- Diagramações de foto ---------- */
.p-sangrada { position: absolute; inset: 0; }
.p-sangrada .zoom { border-radius: 0; }

.p-margem { position: absolute; inset: 14cqw 10cqw 14cqw; display: grid; grid-template-rows: 1fr auto; gap: 3.5cqw; }
.p-margem .zoom { box-shadow: 0 0 0 1px rgb(0 0 0 / .04); }
.legenda { font-style: italic; font-size: max(11.5px, 3cqw); color: var(--tinta-suave); line-height: 1.35; }
.legenda b { font-style: normal; font-weight: 500; color: var(--tinta); font-variant-numeric: oldstyle-nums; margin-right: .35em; }

.p-dupla { position: absolute; inset: 12cqw 10cqw 14cqw; display: grid; grid-template-rows: 1fr 1fr auto; gap: 3cqw; }
.p-grade { position: absolute; inset: 14cqw 10cqw 14cqw; display: grid; grid-template: 1fr 1fr auto / 1fr 1fr; gap: 2.4cqw; }
.p-grade .legenda { grid-column: 1 / -1; margin-top: 1cqw; }

/* panorama: a mesma foto atravessa as duas páginas */
.p-panorama { position: absolute; inset: 0; overflow: hidden; }
.p-panorama .zoom { position: absolute; top: 0; height: 100%; width: 200%; background: transparent; }
.p-panorama--esq .zoom { left: 0; }
.p-panorama--dir .zoom { left: -100%; }

/* ---------- Vídeos ---------- */
.videos-intro .corpo p { text-indent: 0; margin-bottom: .6em; }
.videos-intro .corpo p:first-child::first-letter { float: none; font-size: inherit; margin: 0; color: inherit; font-weight: inherit; line-height: inherit; }
.videos-intro__nota { margin-top: auto !important; font-style: italic; color: var(--tinta-suave); font-size: .9em; }

.p-videos { position: absolute; inset: 14cqw 9cqw 13cqw; display: grid; grid-template-rows: repeat(4, 1fr); gap: 3cqw; }
.video {
  display: grid; grid-template-columns: 48% 1fr; gap: 4cqw; align-items: center;
  text-decoration: none; color: var(--tinta); min-height: 0;
}
.video__mini {
  position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: #cfc7b7;
  box-shadow: 0 2px 8px rgb(0 0 0 / .18);
}
.video__mini img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s, transform .5s var(--curva); }
.video__mini img.is-carregada { opacity: 1; }
.video__mini::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgb(0 0 0 / .35));
}
.video__play {
  position: absolute; z-index: 1; left: 50%; top: 50%; translate: -50% -50%;
  width: 11cqw; height: 11cqw; border-radius: 50%;
  background: rgb(241 237 228 / .92); display: grid; place-items: center;
  box-shadow: 0 2px 10px rgb(0 0 0 / .35); transition: scale .25s var(--curva);
}
.video__play svg { width: 42%; height: 42%; margin-left: 8%; fill: var(--fita); }
a.video:hover .video__mini img { transform: scale(1.05); }
a.video:hover .video__play { scale: 1.1; }
.video__titulo { font-size: 1.05em; line-height: 1.2; font-weight: 500; }
.video__info { display: block; margin-top: .3em; font-style: italic; font-size: .82em; color: var(--tinta-suave); font-weight: 400; }
.video.is-breve { cursor: default; }
.video.is-breve .video__play { background: rgb(241 237 228 / .6); }
.video.is-breve .video__play svg { fill: var(--tinta-suave); }

/* ---------- Colofão ---------- */
.colofao dl { margin: 0; display: grid; gap: 2.2cqw; }
.colofao dt { font-variant-caps: all-small-caps; letter-spacing: .08em; color: var(--tinta-suave); font-size: .85em; }
.colofao dd { margin: 0; font-weight: 500; line-height: 1.25; }
.colofao__contato { margin-top: 5cqw !important; }
.colofao__contato a { color: var(--fita); text-decoration-thickness: 1px; text-underline-offset: .2em; }
.colofao__fim { margin-top: auto !important; font-style: italic; color: var(--tinta-suave); font-size: .88em; }

/* ---------- Controles ---------- */
.controles {
  display: flex; justify-content: center; align-items: center; gap: clamp(1rem, 4vw, 2.5rem);
  padding: .9rem 1rem 1.3rem;
}
.controles button {
  display: inline-flex; align-items: center; gap: .45rem; cursor: pointer;
  background: none; border: 1px solid rgb(233 224 207 / .22); border-radius: 999px;
  padding: .45rem 1.1rem .5rem; font-size: 1.05rem; color: var(--texto-mesa);
  transition: border-color .2s, background-color .2s, opacity .2s;
}
.controles button:hover:not(:disabled) { border-color: var(--ouro); background: rgb(201 166 100 / .1); }
.controles button:disabled { opacity: .3; cursor: default; }
.controles svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.indicador {
  min-width: 13rem; text-align: center;
  font-variant-caps: all-small-caps; letter-spacing: .1em; font-variant-numeric: oldstyle-nums;
  color: rgb(233 224 207 / .7); font-size: 1.05rem;
}
@media (max-width: 820px) {
  .controles button span { display: none; }
  .controles button { padding: .6rem; }
  .indicador { min-width: 11rem; }
  .topo span { display: none; }
}

/* ---------- Lightbox ---------- */
.lb { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: rgb(12 9 7 / .97); color: var(--texto-mesa); overflow: hidden; }
.lb[open] { display: grid; grid-template-rows: auto 1fr; }
.lb::backdrop { background: rgb(12 9 7 / .9); }
.lb__barra { display: flex; align-items: center; gap: 1rem; padding: calc(env(safe-area-inset-top, 0px) + .8rem) 1rem .6rem; font-variant-caps: all-small-caps; letter-spacing: .1em; }
.lb__barra a { margin-left: auto; color: rgb(233 224 207 / .65); text-underline-offset: .2em; }
.lb__fig { margin: 0; display: grid; grid-template-rows: 1fr auto; gap: .8rem; min-height: 0; padding: 0 clamp(1rem, 7vw, 6rem) calc(env(safe-area-inset-bottom, 0px) + 1.2rem); touch-action: pan-y pinch-zoom; }
.lb__fig img { width: 100%; height: 100%; min-height: 0; object-fit: contain; transition: opacity .25s; }
.lb__fig img.is-trocando { opacity: .15; }
.lb__fig figcaption { text-align: center; font-style: italic; color: rgb(233 224 207 / .65); }
.lb__btn { width: 2.8rem; height: 2.8rem; display: grid; place-items: center; cursor: pointer; border: 1px solid rgb(233 224 207 / .2); border-radius: 50%; background: rgb(0 0 0 / .3); }
.lb__btn:hover { border-color: var(--ouro); }
.lb__btn svg { width: 1.1rem; height: 1.1rem; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.lb__ant, .lb__prox { position: absolute; top: 50%; translate: 0 -50%; }
.lb__ant { left: .8rem; } .lb__prox { right: .8rem; }
@media (max-width: 640px) { .lb__ant, .lb__prox { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 3.4rem); translate: none; } }

@media (prefers-reduced-motion: reduce) {
  :root { --virar: .01s; }
  .livro { animation: none; transition: none; }
  .folha.is-movendo .face::after { animation: none; }
}
</style>
</head>
<body>
<div class="mesa" data-mesa>
  <header class="topo">
    <strong>Vai de Rural</strong>
    <span>Mostra Audiovisual Itinerante, 7ª edição</span>
  </header>

  <main class="palco" data-palco>
    <div class="livro is-fechado" data-livro aria-roledescription="livro" aria-label="Fotolivro Vai de Rural">
      <div class="fita" aria-hidden="true"></div>
    </div>
  </main>

  <nav class="controles" aria-label="Virar páginas">
    <button type="button" data-anterior aria-label="Página anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Anterior</span>
    </button>
    <p class="indicador" data-indicador aria-live="polite"></p>
    <button type="button" data-proxima aria-label="Próxima página">
      <span>Próxima</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>
</div>

<dialog class="lb" data-lb aria-label="Foto ampliada">
  <div class="lb__barra">
    <span data-lb-contador></span>
    <a data-lb-original target="_blank" rel="noopener">Abrir original</a>
    <button class="lb__btn" type="button" data-lb-fechar aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <figure class="lb__fig"><img data-lb-img alt="" referrerpolicy="no-referrer" draggable="false"><figcaption data-lb-legenda></figcaption></figure>
  <button class="lb__btn lb__ant" type="button" data-lb-ant aria-label="Foto anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="lb__btn lb__prox" type="button" data-lb-prox aria-label="Próxima foto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</dialog>

<script>
/* ==========================================================================
   CONTEÚDO — edite só este bloco.
   fotos[].src   caminho/URL de imagem própria (tem prioridade sobre driveId)
   fotos[].driveId  ID de arquivo do Drive compartilhado como "Qualquer pessoa com o link"
   videos[].link URL do YouTube/Drive. Vazio = aparece como "em breve".
   videos[].capa índice de uma foto; se omitido e o link for YouTube, usa a miniatura do YouTube.
   ========================================================================== */
const CONTEUDO = {
  email: "contato@vaiderural.com.br",
  fotos: [
    // 7ª edição, Baixão
    { driveId: "1rkLf_W5LWAeRgJJayJhr8Cm139Kl2sAj", grupo: "baixao" },
    { driveId: "1hQySq2h7aiKtukulljfUBwPh_GRg_xtm", grupo: "baixao" },
    { driveId: "1a1lF4Rya9yvRRGb5hQ_3Sv_fwsOK83ZB", grupo: "baixao" },
    { driveId: "17S6L6ttxNNGn6JsCZqLKMCHQxIdnBrm_", grupo: "baixao" },
    { driveId: "1bS9n4qTsoBaevKzWwwcJHn061wZdRwGv", grupo: "baixao" },
    { driveId: "1Qud1F2T2ihEULpf2rh_IaKj8xm8Nh9Xo", grupo: "baixao" },
    { driveId: "1bUQv0-fugBU2p344H9kCpdYrFgpaKn4p", grupo: "baixao" },
    { driveId: "1Qvc4AExYJnWggB0iriJCh45SXFPd7nVm", grupo: "baixao" },
    { driveId: "1z2eLbagEnDZBiNhokHFNpLpdmk1PeKlY", grupo: "baixao" },
    { driveId: "1jkd_97Cdvcex_keoKWnNaJE_QKwzv_tY", grupo: "baixao" },
    { driveId: "1alTvkV2Pqvog6Ia77hTPj62k8na2IJqF", grupo: "baixao" },
    { driveId: "1dk6m2FUML6Apz2bfADcutYzzUbqZQ5QP", grupo: "baixao" },
    { driveId: "1nX6WNrZrmpU9bUIA0TMsdopAavgLOVZv", grupo: "baixao" },
    { driveId: "19z_NJ4fyN-y-uGf_f0-pbxjcDY7UdXne", grupo: "baixao" },
    // 1ª e 2ª edições, Bacia do Paramirim
    { driveId: "1rxnb-rZEclu72oCq5Lq-49szvg5QsLcS", grupo: "paramirim", legenda: "A Rural viaja pela Bacia do Paramirim, 1ª edição" },
    { driveId: "1J1MVTLZCN34J95HVSCmRUDxGGN5WksNk", grupo: "paramirim", legenda: "A Rural viaja pela Bacia do Paramirim, 1ª edição" },
    { driveId: "11Me3qjor7AixJ5asv7-zYLBhBUjlIYTU", grupo: "paramirim", legenda: "A Rural viaja pela Bacia do Paramirim, 2ª edição" },
  ],
  legendaPadrao: { baixao: "Comunidade Quilombola do Baixão, 7ª edição", paramirim: "Bacia do Paramirim" },
  capa: 0,
  videos: [
    { titulo: "Teaser da mostra", info: "7ª edição", link: "", capa: 10 },
    { titulo: "O circo no pátio", info: "Espetáculo", link: "", capa: 5 },
    { titulo: "A sessão de cinema", info: "Mostra de curtas", link: "", capa: 12 },
    { titulo: "Quem estava lá", info: "Depoimentos", link: "", capa: 8 },
  ],
  parceiros: [
    ["Realização", "La Bici Galeria Cultural"],
    ["Apoio financeiro", "Secretaria de Cultura e Prefeitura de Vitória da Conquista"],
    ["Fomento", "Política Nacional Aldir Blanc, Ministério da Cultura, Governo Federal"],
  ],
};

(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const F = CONTEUDO.fotos;

  /* ---------------- Imagens ----------------
     Os JPGs originais têm 15–21 MB: o site nunca usa o original, só versões
     redimensionadas. O endpoint de miniatura do Drive não é API documentada:
     serve para demonstração; em produção prefira `src` com WebP próprio. */
  const fontes = (foto, w) => foto.src ? [foto.src] : [
    `https://drive.google.com/thumbnail?id=${encodeURIComponent(foto.driveId)}&sz=w${w}`,
    `https://lh3.googleusercontent.com/d/${encodeURIComponent(foto.driveId)}=w${w}`,
  ];
  /* onload/onerror como propriedades: reusar o mesmo <img> não acumula handlers */
  function carregar(img, lista, aoCarregar) {
    let i = 0;
    const tentar = () => { if (i < lista.length) img.src = lista[i++]; else img.onerror = null; };
    img.onerror = tentar;
    img.onload = () => { img.onerror = img.onload = null; img.classList.add("is-carregada"); aoCarregar?.(); };
    tentar();
  }
  const legendaDe = (i) => F[i].legenda || CONTEUDO.legendaPadrao[F[i].grupo] || "";
  const LARGURA_PAG = Math.min(2000, Math.round(900 * (window.devicePixelRatio || 1)));
  const foto = (i, w = LARGURA_PAG) =>
    `<button class="zoom" type="button" data-zoom="${i}" aria-label="Ampliar foto: ${esc(legendaDe(i))}"><img data-foto="${i}" data-w="${w}" alt="${esc(legendaDe(i))}" draggable="false" referrerpolicy="no-referrer"></button>`;

  /* ---------------- Páginas ----------------
     Cada página: { id, html, cabeco?, folio?, folioClaro? } */
  const baixao = F.map((_, i) => i).filter((i) => F[i].grupo === "baixao");
  const paramirim = F.map((_, i) => i).filter((i) => F[i].grupo === "paramirim");
  /* numeração das pranchas (cada foto é uma prancha, como num fotolivro) */
  const pranchas = (qtd) => {
    const ini = prancha + 1; prancha += qtd;
    return `<b>${qtd > 1 ? `${ini}–${prancha}` : ini}</b>`;
  };
  let prancha = 0; // numeração das fotos ao longo do livro

  const P = {
    capa: () => ({ id: "capa", html: `
      <div class="tecido capa">
        <p class="capa__sobre ouro">Mostra Audiovisual Itinerante</p>
        <div class="capa__foto">${foto(CONTEUDO.capa, 900)}</div>
        <h1 class="capa__titulo ouro">Vai de Rural</h1>
        <p class="capa__ed ouro">7ª edição</p>
      </div>` }),
    guarda: (id) => ({ id, html: `<div class="guarda"></div>` }),
    rosto: () => ({ id: "rosto", html: `
      <div class="rosto">
        <p class="rosto__lema">É no pé do morro,<br>é lá no cafundó</p>
        <div class="rosto__bloco">
          <h2 class="rosto__titulo">Vai de Rural</h2>
          <div class="rosto__fio"></div>
          <p class="rosto__sub">Mostra Audiovisual Itinerante</p>
          <p class="rosto__ed">7ª edição</p>
        </div>
        <p class="rosto__pe">Comunidade Quilombola do Baixão<br>Vitória da Conquista, Bahia<br>2026</p>
      </div>` }),
    sumario: () => ({ id: "sumario", cabeco: "Vai de Rural", folio: true, html: `
      <div class="miolo sumario">
        <h2 class="h-livro">Sumário</h2>
        <ol data-sumario></ol>
      </div>` }),
    apresentacao: () => ({ id: "apresentacao", cabeco: "Apresentação", folio: true, html: `
      <div class="miolo">
        <h2 class="h-livro">Cinema que viaja do morro ao cafundó</h2>
        <div class="corpo">
          <p>O Vai de Rural leva cinema, circo, fotografia e cultura popular para comunidades rurais e quilombolas da Bahia. Um lençol esticado vira telão, o pátio da escola vira plateia e a Rural carrega tudo pela estrada de terra.</p>
          <p>Na 7ª edição, a mostra chegou à Comunidade Quilombola do Baixão, na Escola Municipal Orlando Spinola, para uma tarde inteira de filmes, circo e festa, gratuita e com intérprete de Libras.</p>
          <p>São sete edições, mais de doze comunidades e mais de oitenta filmes exibidos. Este livro guarda um pouco dessa estrada.</p>
        </div>
      </div>` }),
    capitulo: (id, numeral, titulo, sub) => ({ id, html: `
      <div class="capitulo">
        <p class="capitulo__num">${numeral}</p>
        <h2>${titulo}</h2>
        <div class="capitulo__fio"></div>
        <p class="capitulo__sub">${sub}</p>
      </div>` }),
    sangrada: (i) => { prancha++; return { id: `f${i}`, folio: true, folioClaro: true, html: `<div class="p-sangrada">${foto(i)}</div>` }; },
    margem: (i, cab) => ({ id: `f${i}`, cabeco: cab, folio: true, html: `
      <figure class="p-margem">${foto(i)}<figcaption class="legenda">${pranchas(1)}${esc(legendaDe(i))}</figcaption></figure>` }),
    dupla: (a, b, cab) => ({ id: `f${a}`, cabeco: cab, folio: true, html: `
      <div class="p-dupla">${foto(a, 1200)}${foto(b, 1200)}<p class="legenda">${pranchas(2)}${esc(legendaDe(a))}</p></div>` }),
    grade: (ids, cab) => ({ id: `f${ids[0]}`, cabeco: cab, folio: true, html: `
      <div class="p-grade">${ids.map((i) => foto(i, 800)).join("")}<p class="legenda">${pranchas(ids.length)}${esc(legendaDe(ids[0]))}</p></div>` }),
    panorama: (i, lado) => ({ id: `f${i}-${lado}`, folio: true, folioClaro: true, html: `<div class="p-panorama p-panorama--${lado}">${foto(i, Math.min(2400, LARGURA_PAG * 2))}</div>` }),
    videosIntro: () => ({ id: "videos", cabeco: "Sessão de vídeos", folio: true, html: `
      <div class="miolo videos-intro">
        <h2 class="h-livro">Sessão de vídeos</h2>
        <div class="corpo">
          <p>Os filmes, o circo e as conversas da mostra, agora em movimento.</p>
          <p>Toque numa miniatura para assistir.</p>
        </div>
        <p class="videos-intro__nota">Os vídeos abrem numa nova aba.</p>
      </div>` }),
    videos: () => ({ id: "videos-lista", cabeco: "Sessão de vídeos", folio: true, html: `
      <div class="p-videos">${CONTEUDO.videos.map(videoCard).join("")}</div>` }),
    colofao: () => ({ id: "colofao", cabeco: "Vai de Rural", folio: true, html: `
      <div class="miolo colofao">
        <h2 class="h-livro">Quem faz acontecer</h2>
        <dl>${CONTEUDO.parceiros.map(([p, n]) => `<div><dt>${esc(p)}</dt><dd>${esc(n)}</dd></div>`).join("")}</dl>
        <p class="colofao__contato">Contato: <a href="mailto:${esc(CONTEUDO.email)}">${esc(CONTEUDO.email)}</a></p>
        <p class="colofao__fim">Composto em EB Garamond. Até a próxima estrada.</p>
      </div>` }),
    contracapa: () => ({ id: "contracapa", html: `
      <div class="tecido contracapa">
        <p class="contracapa__marca ouro">Vai de Rural</p>
        <p class="contracapa__lema ouro">É no pé do morro,<br>é lá no cafundó</p>
        <p class="contracapa__fino ouro">Evento gratuito e acessível em Libras</p>
      </div>` }),
  };

  const ytId = (url) => (url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/) || [])[1];
  function videoCard(v) {
    const breve = !v.link;
    const id = !breve && ytId(v.link);
    const mini = v.capa != null
      ? `<img data-foto="${v.capa}" data-w="600" alt="" referrerpolicy="no-referrer">`
      : id ? `<img data-src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" referrerpolicy="no-referrer">` : "";
    const corpo = `
      <span class="video__mini">${mini}<span class="video__play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg></span></span>
      <span class="video__titulo">${esc(v.titulo)}<span class="video__info">${esc(breve ? `${v.info}, em breve` : v.info)}</span></span>`;
    return breve
      ? `<div class="video is-breve">${corpo}</div>`
      : `<a class="video" href="${esc(v.link)}" target="_blank" rel="noopener" aria-label="Assistir: ${esc(v.titulo)} (abre em nova aba)">${corpo}</a>`;
  }

  /* Sequência de páginas. No livro aberto, índices ímpares ficam à esquerda
     e pares à direita (a capa, 0, é a primeira direita). No celular cada
     página é uma folha: guardas somem e o panorama vira foto sangrada. */
  function montar(simples) {
    prancha = 0;
    const b = baixao, p = paramirim, I = "Baixão", II = "Bacia do Paramirim";
    const lista = [
      P.capa(),
      !simples && P.guarda("guarda-1"),
      P.rosto(),
      P.sumario(),
      P.apresentacao(),
      P.sangrada(b[0]),
      P.capitulo("cap1", "I", "Baixão", "<em>7ª edição</em><br>Comunidade Quilombola do Baixão<br>24 de março de 2026"),
      P.sangrada(b[1]),
      P.margem(b[2], I),
      ...(simples ? [P.sangrada(b[3])] : (prancha++, [P.panorama(b[3], "esq"), P.panorama(b[3], "dir")])), // panorama conta como 1 prancha
      P.dupla(b[4], b[5], I),
      P.sangrada(b[6]),
      P.margem(b[7], I),
      P.grade([b[8], b[9], b[10], b[11]], I),
      P.sangrada(b[12]),
      P.margem(b[13], I),
      P.capitulo("cap2", "II", "Bacia do Paramirim", "<em>1ª e 2ª edições</em><br>As primeiras viagens da Rural"),
      P.sangrada(p[0]),
      P.margem(p[1], II),
      P.margem(p[2], II),
      P.videosIntro(),
      P.videos(),
      P.colofao(),
      !simples && P.guarda("guarda-2"),
      P.contracapa(),
    ].filter(Boolean);
    if (!simples && lista.length % 2) lista.splice(lista.length - 1, 0, P.guarda("guarda-extra"));
    return lista;
  }

  /* ---------------- Livro ---------------- */
  const mesa = $("[data-mesa]");
  const livro = $("[data-livro]");
  const fita = $(".fita");
  const indicador = $("[data-indicador]");
  const btnAnt = $("[data-anterior]");
  const btnProx = $("[data-proxima]");
  const mqSimples = matchMedia("(max-width: 820px)");
  const reduz = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TEMPO = reduz ? 20 : 1100;

  let simples, paginas, folhas, faces, L, t = 0;

  function construir(paginaAlvo = 0) {
    simples = mqSimples.matches;
    mesa.classList.toggle("is-simples", simples);
    paginas = montar(simples);
    livro.querySelectorAll(".folha").forEach((f) => f.remove());
    faces = [];
    folhas = [];

    const lado = (i) => (simples || i % 2 === 0 ? "dir" : "esq");
    const html = (pg, i) => {
      if (!pg) return `<div class="pagina"></div>`;
      const cab = pg.cabeco ? `<span class="cabeco">${esc(pg.cabeco)}</span>` : "";
      const fol = pg.folio ? `<span class="folio${pg.folioClaro ? " folio--claro" : ""}">${i}</span>` : "";
      return `<div class="pagina pagina--${lado(i)}" data-pagina="${i}">${cab}${pg.html}${fol}</div>`;
    };

    const passo = simples ? 1 : 2;
    for (let i = 0; i < paginas.length; i += passo) {
      const folha = document.createElement("div");
      folha.className = "folha";
      folha.innerHTML =
        `<div class="face face--frente">${html(paginas[i], i)}</div>` +
        (simples ? `<div class="face face--verso"><div class="pagina"></div></div>` : `<div class="face face--verso">${html(paginas[i + 1], i + 1)}</div>`);
      livro.insertBefore(folha, fita);
      folhas.push(folha);
      faces.push(folha.children[0]);
      if (!simples) faces.push(folha.children[1]);
    }
    L = folhas.length;

    // sumário com números de página reais desta montagem
    const idx = (id) => paginas.findIndex((p) => p.id === id);
    const entradas = [
      ["", "Apresentação", "apresentacao"],
      ["I", "Baixão, 7ª edição", "cap1"],
      ["II", "Bacia do Paramirim", "cap2"],
      ["", "Sessão de vídeos", "videos"],
      ["", "Quem faz acontecer", "colofao"],
    ];
    const ol = livro.querySelector("[data-sumario]");
    ol.innerHTML = entradas.map(([n, r, id]) =>
      `<li><button type="button" data-ir="${idx(id)}"><span class="sumario__num">${n}</span><span class="sumario__rotulo">${r}</span><span class="sumario__pontos"></span><span class="sumario__pag">${idx(id)}</span></button></li>`
    ).join("");

    t = Math.min(L - 1 + (simples ? 0 : 1), folhaDaPagina(paginaAlvo));
    folhas.forEach((f, i) => f.classList.toggle("is-virada", i < t));
    atualizar();
  }

  const folhaDaPagina = (p) => (simples ? p : Math.ceil(p / 2));
  const paginaAtual = () => (simples ? t : Math.max(0, 2 * t - 1));

  function zIndex() {
    folhas.forEach((f, i) => { if (!f.classList.contains("is-movendo")) f.style.zIndex = i < t ? i + 1 : L - i + 1; });
  }

  function atualizar() {
    const max = simples ? L - 1 : L;
    livro.classList.toggle("is-fechado", t === 0);
    livro.classList.toggle("is-final", !simples && t === L);
    btnAnt.disabled = t === 0;
    btnProx.disabled = t >= max;
    zIndex();

    // só as páginas visíveis ficam acessíveis ao teclado / leitor de tela
    const visiveis = simples ? [t] : [2 * t - 1, 2 * t];
    faces.forEach((face) => {
      const pg = face.querySelector("[data-pagina]");
      const n = pg ? +pg.dataset.pagina : -1;
      face.inert = !visiveis.includes(n);
    });

    // texto do indicador
    const n = paginas.length - 1;
    if (t === 0) indicador.textContent = "Toque na capa para abrir";
    else if (simples) indicador.textContent = t === n ? "Contracapa" : `Página ${t} de ${n}`;
    else indicador.textContent = t === L ? "Contracapa" : `Páginas ${2 * t - 1} e ${2 * t} de ${n}`;

    // carrega fotos das páginas próximas (economia de dados e memória)
    const centro = paginaAtual();
    const de = centro - (simples ? 2 : 4), ate = centro + (simples ? 4 : 7);
    livro.querySelectorAll("[data-pagina]").forEach((pg) => {
      const i = +pg.dataset.pagina;
      if (i < de || i > ate) return;
      pg.querySelectorAll("img[data-foto]:not([src]), img[data-src]:not([src])").forEach((img) => {
        if (img.dataset.src) carregar(img, [img.dataset.src]);
        else carregar(img, fontes(F[+img.dataset.foto], +img.dataset.w));
      });
    });
  }

  function mover(folha, virar, ordem) {
    folha.classList.add("is-movendo");
    folha.style.zIndex = 500 + ordem;
    folha.classList.toggle("is-virada", virar);
    clearTimeout(folha._fim);
    folha._fim = setTimeout(() => { folha.classList.remove("is-movendo"); zIndex(); }, TEMPO + 60);
  }

  function irPara(alvo) {
    const max = simples ? L - 1 : L;
    alvo = Math.max(0, Math.min(max, alvo));
    if (alvo === t) return;
    const passo = alvo > t ? 1 : -1;
    const intervalo = Math.abs(alvo - t) > 1 ? 110 : 0;   // folheia rápido ao pular
    let k = 0;
    for (let i = t; i !== alvo; i += passo) {
      const folha = folhas[passo > 0 ? i : i - 1];
      setTimeout(() => mover(folha, passo > 0, k), k * intervalo);
      k++;
    }
    t = alvo;
    atualizar();
  }
  const proxima = () => irPara(t + 1);
  const anterior = () => irPara(t - 1);

  btnProx.addEventListener("click", proxima);
  btnAnt.addEventListener("click", anterior);

  // clique na página: direita avança, esquerda volta; foto abre ampliada
  let arrastou = false;
  livro.addEventListener("click", (e) => {
    if (arrastou) { arrastou = false; return; }
    const ir = e.target.closest("[data-ir]");
    if (ir) { irPara(folhaDaPagina(+ir.dataset.ir)); return; }
    const z = e.target.closest("[data-zoom]");
    if (z && t > 0) { lightbox.abrir(+z.dataset.zoom); return; }
    if (e.target.closest("a, .video")) return;
    const face = e.target.closest(".face");
    if (!face) return;
    face.classList.contains("face--frente") ? proxima() : anterior();
  });

  // swipe
  let x0 = null, y0 = 0;
  const palco = $("[data-palco]");
  palco.addEventListener("pointerdown", (e) => { x0 = e.clientX; y0 = e.clientY; arrastou = false; });
  palco.addEventListener("pointerup", (e) => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
      arrastou = true;
      dx < 0 ? proxima() : anterior();
    }
  });

  document.addEventListener("keydown", (e) => {
    if (lightbox.aberto()) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); proxima(); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); anterior(); }
    if (e.key === "Home") irPara(0);
    if (e.key === "End") irPara(simples ? L - 1 : L);
  });

  // troca de modo (girar o celular / redimensionar) mantendo a página
  mqSimples.addEventListener("change", () => construir(paginas[paginaAtual()] ? paginaAtual() : 0));

  /* ---------------- Lightbox ---------------- */
  const lightbox = (() => {
    const dlg = $("[data-lb]"), img = $("[data-lb-img]"), leg = $("[data-lb-legenda]");
    const cont = $("[data-lb-contador]"), orig = $("[data-lb-original]");
    const W = Math.min(2400, Math.ceil((screen.width || 1600) * (devicePixelRatio || 1)));
    let atual = 0;
    function mostrar(i) {
      atual = (i + F.length) % F.length;
      img.classList.add("is-trocando");
      img.alt = legendaDe(atual);
      carregar(img, fontes(F[atual], W), () => img.classList.remove("is-trocando"));
      leg.textContent = legendaDe(atual);
      cont.textContent = `${atual + 1} de ${F.length}`;
      orig.href = F[atual].driveId ? `https://drive.google.com/file/d/${F[atual].driveId}/view` : F[atual].src;
      [atual - 1, atual + 1].forEach((v) => { new Image().src = fontes(F[(v + F.length) % F.length], W)[0]; });
    }
    dlg.addEventListener("close", () => { img.removeAttribute("src"); });
    $("[data-lb-fechar]").addEventListener("click", () => dlg.close());
    $("[data-lb-ant]").addEventListener("click", () => mostrar(atual - 1));
    $("[data-lb-prox]").addEventListener("click", () => mostrar(atual + 1));
    dlg.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") mostrar(atual - 1);
      if (e.key === "ArrowRight") mostrar(atual + 1);
    });
    let lx = null;
    const fig = $(".lb__fig");
    fig.addEventListener("pointerdown", (e) => { lx = e.clientX; });
    fig.addEventListener("pointerup", (e) => {
      if (lx === null) return;
      const dx = e.clientX - lx; lx = null;
      if (Math.abs(dx) > 50) mostrar(atual + (dx < 0 ? 1 : -1));
    });
    return { abrir(i) { mostrar(i); dlg.showModal(); }, aberto: () => dlg.open };
  })();

  construir(0);
})();
</script>
</body>
</html>
