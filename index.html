<!DOCTYPE html>

<head>

<meta property="og:description" content="Sete edições levando cinema, circo, fotografia e cultura popular a comunidades rurais e quilombolas da Bahia.">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Shrikhand&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   TOKENS
   Shrikhand: letreiro de circo/festa, só para títulos grandes (tem um peso só).
   Bricolage Grotesque: texto e interface; os eixos de largura e tamanho óptico
   dão variação sem precisar de uma terceira fonte.
   Cada edição tem cor própria (nos dados). A cor do texto sobre ela é
   calculada no JS para manter contraste legível.
   ========================================================================= */
:root {
  --anil: #1f2a6b;
  --noite: #151d4d;
  --sol: #ffc21a;
  --urucum: #e8452c;
  --rosa: #ff5c9a;
  --ceu: #29a8e0;
  --mato: #1f9d62;
  --papel: #ffffff;
  --texto: #1b1f3a;
  --texto-2: #4a4f6e;
  --borda: #e6e2f0;
  --raio: 18px;
  --display: "Shrikhand", "Cooper Black", "Georgia", serif;
  --corpo: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --largura: 1200px;
  --cor: var(--anil);
  --tinta: #fff;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--papel); color: var(--texto);
  font: 400 1.0625rem/1.6 var(--corpo); font-optical-sizing: auto;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--rosa); outline-offset: 3px; border-radius: 6px; }
.envelope { width: min(100% - 2.5rem, var(--largura)); margin-inline: auto; }
h1, h2, h3 { margin: 0; line-height: 1.02; }
.display { font-family: var(--display); font-weight: 400; letter-spacing: .005em; }
.titulo { font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 6vw, 3.6rem); color: var(--anil); }
.intro { font-size: 1.15rem; color: var(--texto-2); max-width: 58ch; margin: .9rem 0 0; }

/* ---------- Cabeçalho ---------- */
.topo { position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px); background: var(--anil); color: #fff; }
.topo__linha { display: flex; align-items: center; gap: 1rem; min-height: 64px; }
.marca { font-family: var(--display); font-size: 1.45rem; text-decoration: none; white-space: nowrap; color: var(--sol); }
.menu { margin-left: auto; display: flex; gap: .25rem; }
.menu a { text-decoration: none; font-weight: 700; font-size: .98rem; padding: .45rem .85rem; border-radius: 999px; white-space: nowrap; }
.menu a:hover { background: rgba(255,255,255,.12); }
.menu a[aria-current="page"] { background: var(--sol); color: var(--anil); }
@media (max-width: 600px) {
  .topo__linha { flex-wrap: wrap; gap: .1rem; padding: .5rem 0 .45rem; min-height: 0; }
  .menu { margin-left: 0; width: 100%; justify-content: space-between; }
  .menu a { padding: .4rem .7rem; font-size: .95rem; }
}
.bandeirinhas { display: block; width: 100%; height: 22px; transform-origin: top; }

/* ---------- Abertura ---------- */
.abertura { background: var(--sol); padding: clamp(2.5rem, 6vw, 4.5rem) 0 clamp(3.5rem, 7vw, 5.5rem); overflow: hidden; position: relative; }
.abertura__grade { display: grid; gap: 3rem; align-items: center; }
@media (min-width: 920px) { .abertura__grade { grid-template-columns: 1.1fr 1fr; } }
.abertura__pre { font-weight: 800; font-stretch: 80%; font-size: 1.05rem; color: var(--anil); margin: 0 0 .5rem; }
.abertura h1 { font-family: var(--display); font-weight: 400; color: var(--anil); font-size: clamp(3.6rem, 13vw, 8.4rem); line-height: .92; }
.abertura h1 .l { display: inline-block; }
.abertura h1 .rural .l:nth-child(1) { color: var(--urucum); }
.abertura h1 .rural .l:nth-child(2) { color: var(--rosa); }
.abertura h1 .rural .l:nth-child(3) { color: var(--ceu); }
.abertura h1 .rural .l:nth-child(4) { color: var(--mato); }
.abertura h1 .rural .l:nth-child(5) { color: #6e4bc0; }
.abertura__sub { font-size: clamp(1.15rem, 2.3vw, 1.45rem); font-weight: 600; line-height: 1.4; margin: 1.4rem 0 .4rem; max-width: 30ch; color: var(--anil); }
.abertura__lema { font-family: var(--display); font-size: 1.2rem; color: var(--urucum); margin: 0 0 1.8rem; }
.botoes { display: flex; flex-wrap: wrap; gap: .75rem; }
.botao {
  display: inline-flex; align-items: center; text-decoration: none; border: 0;
  font-weight: 800; padding: .9rem 1.4rem; border-radius: 999px;
  background: var(--anil); color: #fff; box-shadow: 0 4px 0 var(--noite);
  transition: transform .12s ease, box-shadow .12s ease;
}
.botao:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--noite); }
.botao:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--noite); }
.botao--branco { background: #fff; color: var(--anil); }

/* Colagem de fotos tipo polaroide */
.colagem { position: relative; min-height: 360px; }
@media (min-width: 920px) { .colagem { min-height: 480px; } }
.polaroide {
  position: absolute; background: #fff; padding: 10px 10px 34px; border-radius: 6px;
  box-shadow: 0 14px 30px rgba(31, 42, 107, .25); transition: transform .3s ease;
}
.polaroide img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #efeaf8; border-radius: 3px; }
.polaroide:nth-child(1) { width: 58%; left: 0; top: 6%; transform: rotate(-6deg); z-index: 2; }
.polaroide:nth-child(2) { width: 50%; right: 0; top: 0; transform: rotate(5deg); }
.polaroide:nth-child(3) { width: 46%; right: 8%; bottom: 0; transform: rotate(-2deg); z-index: 3; }
.polaroide:hover { transform: rotate(0) scale(1.03); z-index: 5; }
.selo {
  position: absolute; z-index: 6; display: grid; place-items: center; text-align: center;
  width: 108px; height: 108px; border-radius: 50%; font-weight: 800; font-stretch: 80%;
  line-height: 1.1; font-size: .95rem; padding: .6rem; transform: rotate(-12deg);
}
.selo--gratis { background: var(--rosa); color: #fff; left: -6px; bottom: 4%; }
.selo--libras { background: var(--ceu); color: var(--noite); right: -8px; top: 42%; transform: rotate(10deg); }
@media (max-width: 600px) { .selo { width: 88px; height: 88px; font-size: .82rem; } }

/* Animação de entrada do título: o único movimento automático do site */
@keyframes pula {
  0% { opacity: 0; transform: translateY(40%) scale(.6) rotate(-8deg); }
  60% { opacity: 1; transform: translateY(-6%) scale(1.08) rotate(3deg); }
  100% { opacity: 1; transform: none; }
}
.entrar .l { animation: pula .6s cubic-bezier(.3, 1.4, .5, 1) both; animation-delay: calc(var(--i) * 45ms); }

/* ---------- Faixa corrida ---------- */
.faixa { background: var(--anil); color: #fff; overflow: hidden; padding: .9rem 0; border-block: 4px solid var(--rosa); }
.faixa__trilha { display: flex; width: max-content; animation: corre 45s linear infinite; }
.faixa:hover .faixa__trilha { animation-play-state: paused; }
.faixa ul { display: flex; list-style: none; margin: 0; padding: 0; }
.faixa li { font-family: var(--display); font-size: clamp(1.2rem, 2.6vw, 1.7rem); white-space: nowrap; padding-right: 2.2rem; }
.faixa li::after { content: "✦"; color: var(--sol); margin-left: 2.2rem; font-family: var(--corpo); }
@keyframes corre { to { transform: translateX(-50%); } }

/* ---------- Estrada ---------- */
.estrada-sec { background: var(--anil); color: #fff; padding: clamp(3rem, 7vw, 4.5rem) 0 3rem; overflow: hidden; }
.estrada-sec .titulo { color: var(--sol); }
.estrada-sec .intro { color: #cfd4f3; }
.estrada { position: relative; margin-top: 2rem; overflow-x: auto; overscroll-behavior-x: contain; padding-bottom: .5rem; scrollbar-width: thin; }
.estrada__trilho { position: relative; min-width: 880px; padding-top: 92px; }
.estrada__asfalto { position: absolute; left: 0; right: 0; top: 124px; height: 28px; border-radius: 14px; background: var(--noite); }
.estrada__asfalto::after {
  content: ""; position: absolute; left: 14px; right: 14px; top: 12px; height: 4px;
  background: repeating-linear-gradient(90deg, var(--sol) 0 24px, transparent 24px 44px);
}
.estrada__paradas { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); list-style: none; margin: 0; padding: 0; }
.parada { text-align: center; }
.parada a { display: inline-flex; flex-direction: column; align-items: center; gap: .6rem; text-decoration: none; padding: .25rem; border-radius: 12px; }
.parada__num {
  width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center;
  background: var(--c); color: var(--t, #fff); font-family: var(--display); font-size: 2.3rem;
  box-shadow: 0 0 0 6px var(--anil), 0 0 0 10px var(--c); transition: transform .2s cubic-bezier(.3, 1.6, .5, 1);
}
.parada a:hover .parada__num, .parada a:focus-visible .parada__num { transform: scale(1.12) rotate(-6deg); }
.parada__local { font-weight: 700; font-size: .92rem; line-height: 1.25; max-width: 15ch; }
.parada__ano { font-size: .82rem; color: #aab2e6; min-height: 1.2em; }
.estrada__rural { position: absolute; top: 26px; left: 0; width: 124px; transition: transform .8s cubic-bezier(.5, 0, .2, 1); pointer-events: none; }
.estrada__rural svg { width: 100%; height: auto; display: block; }
.estrada__dica { font-size: .85rem; color: #aab2e6; margin-top: .5rem; }
@media (min-width: 920px) { .estrada__dica { display: none; } }
.rural__blusa { fill: var(--sol); } .rural__saia { fill: #fff; } .rural__vidro { fill: #9fd4ef; }
.rural__friso { stroke: var(--urucum); stroke-width: 4; } .rural__rack, .rural__projetor { fill: #fff; }
.rural__lente { fill: var(--urucum); } .rural__farol { fill: #fff3b0; } .rural__caixa { fill: var(--noite); }
.rural__pneu { fill: #0e1334; } .rural__calota { fill: #d6d9ea; }

/* ---------- Seções ---------- */
.secao { padding: clamp(3.5rem, 8vw, 6rem) 0; }
.secao--rosa { background: #ffe3ee; }
.secao--ceu { background: #e2f4fc; }

/* O que a Rural leva */
.linguagens { display: grid; gap: 1rem; margin-top: 2.25rem; grid-template-columns: 1fr; }
@media (min-width: 640px) { .linguagens { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1000px) { .linguagens { grid-template-columns: repeat(4, 1fr); } }
.linguagem { border-radius: var(--raio); padding: 1.6rem 1.4rem 1.5rem; background: var(--c); color: var(--t); transition: transform .2s ease; }
.linguagem:nth-child(odd) { transform: rotate(-1.2deg); }
.linguagem:nth-child(even) { transform: rotate(1.2deg); }
.linguagem:hover { transform: rotate(0) translateY(-4px); }
.linguagem h3 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; margin-bottom: .6rem; }
.linguagem p { margin: 0; font-weight: 500; }

/* Sobre + fatos */
.sobre { display: grid; gap: 2.5rem; }
@media (min-width: 920px) { .sobre { grid-template-columns: 1.3fr 1fr; align-items: center; } }
.sobre p { max-width: 62ch; margin: 0 0 1rem; font-size: 1.1rem; }
.fatos { display: grid; gap: .9rem; margin: 0; }
.fatos div { display: flex; align-items: baseline; gap: 1rem; background: #fff; border-radius: var(--raio); padding: 1rem 1.3rem; border: 3px solid var(--anil); box-shadow: 5px 5px 0 var(--anil); }
.fatos dd { order: -1; margin: 0; font-family: var(--display); font-size: 2.6rem; color: var(--urucum); line-height: 1; min-width: 3.2ch; }
.fatos dt { font-weight: 700; font-size: 1.05rem; }

/* ---------- Cartões (vídeos e edições) ---------- */
.cartoes { display: grid; gap: 1.4rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); margin-top: 2rem; }
.cartao {
  display: flex; flex-direction: column; text-align: left; padding: 0; text-decoration: none;
  background: #fff; border-radius: var(--raio); overflow: hidden; border: 3px solid var(--anil);
  box-shadow: 5px 5px 0 var(--vc, var(--anil)); transition: transform .15s ease, box-shadow .15s ease;
}
.cartao:hover { transform: translate(-3px, -3px); box-shadow: 8px 8px 0 var(--vc, var(--anil)); }
.cartao__capa { position: relative; aspect-ratio: 16 / 9; background: var(--vc, var(--noite)); overflow: hidden; border-bottom: 3px solid var(--anil); }
.cartao__capa img { width: 100%; height: 100%; object-fit: cover; }
.cartao__num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 5rem; color: var(--t, #fff); }
.cartao__play {
  position: absolute; inset: 0; margin: auto; width: 64px; height: 64px; border-radius: 50%;
  background: var(--sol); display: grid; place-items: center; border: 3px solid var(--anil);
  transition: transform .2s cubic-bezier(.3, 1.6, .5, 1);
}
.cartao:hover .cartao__play { transform: scale(1.15); }
.cartao__play svg { width: 24px; height: 24px; fill: var(--anil); margin-left: 4px; }
.cartao__info { padding: .9rem 1.05rem 1.1rem; display: grid; gap: .35rem; }
.cartao__titulo { font-weight: 800; font-size: 1.05rem; line-height: 1.3; }
.cartao__etiqueta { font-size: .85rem; font-weight: 700; font-stretch: 85%; color: var(--texto-2); display: flex; align-items: center; gap: .45rem; }
.cartao__etiqueta::before { content: ""; width: .75rem; height: .75rem; border-radius: 50%; background: var(--vc, var(--anil)); flex: none; }

.filtros { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; }
.filtro { border: 3px solid var(--anil); background: #fff; border-radius: 999px; padding: .4rem 1rem; font-weight: 700; }
.filtro[aria-pressed="true"] { background: var(--fc, var(--anil)); color: var(--t, #fff); }

/* ---------- Página de edição ---------- */
.ed-topo { background: var(--cor); color: var(--tinta); padding: clamp(2.5rem, 6vw, 4.5rem) 0 clamp(2.2rem, 5vw, 3.2rem); position: relative; overflow: hidden; }
.ed-topo__num {
  position: absolute; right: .02em; bottom: -.2em; font-family: var(--display);
  font-size: clamp(11rem, 36vw, 26rem); line-height: 1; opacity: .16; pointer-events: none; user-select: none;
}
.ed-topo__voltar { display: inline-block; font-weight: 700; margin-bottom: 1.2rem; text-decoration: none; }
.ed-topo__voltar:hover { text-decoration: underline; }
.ed-topo__edicao { font-weight: 800; font-stretch: 80%; font-size: 1.15rem; margin: 0 0 .35rem; }
.ed-topo h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.4rem, 7vw, 4.8rem); max-width: 17ch; position: relative; }
.ficha { display: flex; flex-wrap: wrap; gap: .55rem; margin: 1.5rem 0 0; padding: 0; list-style: none; position: relative; }
.ficha li { background: rgba(255,255,255,.25); border: 2px solid currentColor; padding: .4rem .9rem; border-radius: 999px; font-weight: 700; font-size: .92rem; }
.ed-corpo { padding: clamp(2.5rem, 6vw, 4rem) 0; }
.ed-texto p { max-width: 64ch; margin: 0 0 1rem; font-size: 1.15rem; }
.pendente { border: 3px dashed var(--anil); border-radius: var(--raio); padding: 1rem 1.2rem; margin: 1.5rem 0; max-width: 64ch; color: var(--texto-2); background: #fffbea; }
.pendente strong { color: var(--texto); }
.bloco { margin-top: 3.2rem; }
.bloco h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.9rem, 4.5vw, 2.6rem); color: var(--anil); }
.bloco h2::after { content: ""; display: block; width: 4rem; height: 7px; border-radius: 4px; background: var(--cor); margin-top: .45rem; }

/* Galeria em polaroides */
.galeria { display: grid; gap: 1.4rem 1rem; grid-template-columns: repeat(2, 1fr); margin-top: 1.6rem; }
@media (min-width: 700px) { .galeria { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1040px) { .galeria { grid-template-columns: repeat(4, 1fr); } }
.foto { margin: 0; }
.foto button {
  display: block; width: 100%; border: 0; background: #fff; padding: 8px 8px 10px; border-radius: 6px;
  box-shadow: 0 8px 20px rgba(31, 42, 107, .16); transition: transform .25s ease;
}
.foto:nth-child(3n+1) button { transform: rotate(-1.8deg); }
.foto:nth-child(3n+2) button { transform: rotate(1.4deg); }
.foto:nth-child(3n) button { transform: rotate(-.6deg); }
.foto button:hover { transform: rotate(0) scale(1.04); }
.foto img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #efeaf8; border-radius: 3px; }
.foto figcaption { font-size: .85rem; color: var(--texto-2); padding: .45rem .2rem 0; line-height: 1.35; }
.foto--destaque { grid-column: span 2; }
.foto--destaque img { aspect-ratio: 16 / 10; }
.vazio {
  display: grid; place-items: center; text-align: center; min-height: 170px; padding: 2rem; margin-top: 1.6rem;
  border-radius: var(--raio); border: 3px dashed var(--cor); color: var(--texto-2); font-weight: 600;
}
.ed-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 3.5rem; }
.ed-nav a { text-decoration: none; padding: 1.1rem 1.25rem; border-radius: var(--raio); color: var(--t, #fff); background: var(--c); display: grid; gap: .1rem; border: 3px solid var(--anil); box-shadow: 5px 5px 0 var(--anil); }
.ed-nav a:last-child { text-align: right; }
.ed-nav small { font-weight: 700; font-size: .9rem; }
.ed-nav strong { font-family: var(--display); font-weight: 400; font-size: 1.6rem; }

/* ---------- Rodapé ---------- */
.rodape { background: var(--anil); color: #d6daf5; padding: 3.2rem 0 2.6rem; }
.rodape .titulo { color: var(--sol); font-size: 2rem; margin-bottom: 1rem; }
.rodape__grade { display: grid; gap: 2rem; }
@media (min-width: 820px) { .rodape__grade { grid-template-columns: 2fr 1fr; } }
.parceiros { display: grid; gap: .8rem; margin: 0; }
.parceiros dt { font-weight: 800; font-stretch: 85%; color: var(--sol); font-size: .88rem; }
.parceiros dd { margin: 0; }
.rodape a { color: #fff; font-weight: 700; }

/* ---------- Janelas ---------- */
dialog { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; }
dialog::backdrop { background: rgba(21, 29, 77, .94); }
.janela { width: 100vw; height: 100dvh; display: grid; place-items: center; padding: 3.5rem 1rem 1.5rem; color: #fff; }
.janela__fechar {
  position: fixed; top: calc(.75rem + env(safe-area-inset-top, 0px)); right: .75rem; z-index: 2;
  width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--sol); color: var(--anil); font-size: 1.6rem; line-height: 1; font-weight: 800;
}
.lb__img { max-width: min(100%, 1400px); max-height: calc(100dvh - 9rem); object-fit: contain; border-radius: 8px; }
.lb__legenda { text-align: center; margin: .75rem auto 0; max-width: 60ch; }
.lb__seta { position: fixed; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); font-size: 1.6rem; }
.lb__seta--ant { left: .75rem; } .lb__seta--prox { right: .75rem; }
@media (max-width: 640px) { .lb__seta { top: auto; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); transform: none; } }
.vd__quadro { width: min(100%, 1100px); aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
.vd__quadro iframe { width: 100%; height: 100%; border: 0; display: block; }
.vd__rodape { width: min(100%, 1100px); margin-top: .75rem; display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; justify-content: space-between; }
.vd__rodape a { color: var(--sol); font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  .faixa__trilha { width: auto; flex-wrap: wrap; }
  .faixa ul[aria-hidden] { display: none; }
}
</style>
</head>
<body>

<header class="topo">

/* =========================================================================

   funciona em hospedagem estática (GitHub Pages) sem configurar servidor.
   ========================================================================= */
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const P = CONTEUDO.projeto, EDS = CONTEUDO.edicoes, VIDS = CONTEUDO.videos;
  const main = $("#conteudo");
  const ed = n => EDS.find(e => e.n === n);

  /* Cor do texto sobre uma cor de fundo: branco se tiver contraste AA (4,5:1),
     senão anil. Qualquer cor nova nos dados continua legível. */
  const luz = hex => hex.match(/\w\w/g).map(h => parseInt(h, 16) / 255)
    .map(c => c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4)
    .reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0);
  const tinta = hex => 1.05 / (luz(hex) + 0.05) >= 4.5 ? "#fff" : "#1f2a6b";
  EDS.forEach(e => { e.tinta = tinta(e.cor); });
  P.linguagens.forEach(l => { l.tinta = tinta(l.cor); });

  /* Fotos do Drive: miniatura redimensionada pelo próprio Google.
     Não é API documentada; se falhar, tenta o CDN lh3. Para produção,
     o ideal é hospedar as fotos otimizadas (WebP) junto com o site. */
  const foto = (id, w) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
  const fotoReserva = (id, w) => `https://lh3.googleusercontent.com/d/${encodeURIComponent(id)}=w${w}`;
  document.addEventListener("error", e => {
    const img = e.target;
    if (img.tagName !== "IMG" || !img.dataset.drive || img.dataset.tentou) return;
    img.dataset.tentou = "1";
    img.src = fotoReserva(img.dataset.drive, img.dataset.w);
  }, true);
  const imgDrive = (id, w, alt, extra = "") =>
    `<img src="${foto(id, w)}" data-drive="${esc(id)}" data-w="${w}" alt="${esc(alt)}" loading="lazy" decoding="async" ${extra}>`;
  const legendaFoto = (e, f) => f.legenda || `${e.titulo}, ${e.n}ª edição`;
  const rotuloEd = e => `${e.n}ª edição`;

  /* ---------- Vídeos ---------- */
  const thumbYT = id => `https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`;
  const tituloVideo = v => v.titulo || `Vídeo ${VIDS.indexOf(v) + 1}`;
  const cartaoVideo = v => {
    const e = v.edicao ? ed(v.edicao) : null;
    return `<button class="cartao" data-video="${VIDS.indexOf(v)}" style="${e ? `--vc:${e.cor}` : "--vc:var(--sol)"}">
      <span class="cartao__capa">
        <img src="${thumbYT(v.id)}" alt="" loading="lazy" decoding="async">
        <span class="cartao__play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>
      </span>
      <span class="cartao__info">
        <span class="cartao__titulo">${esc(tituloVideo(v))}</span>
        ${e ? `<span class="cartao__etiqueta">${rotuloEd(e)}</span>` : ""}
      </span>
    </button>`;
  };

  /* Títulos pelo oEmbed do YouTube (com um serviço público de reserva).
     Se o título trouxer "Nª edição", o vídeo entra na página da edição.
     Se tudo falhar, os cartões seguem como "Vídeo N". */
  async function carregarTitulos() {
    const pega = async url => {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 6000);
      try {
        const r = await fetch(url, { signal: ctrl.signal });
        if (!r.ok) return null;
        const j = await r.json();
        return j && typeof j.title === "string" ? j.title : null;
      } catch { return null; } finally { clearTimeout(t); }
    };
    let mudou = false;
    await Promise.all(VIDS.map(async v => {
      const watch = encodeURIComponent(`https://www.youtube.com/watch?v=${v.id}`);
      const titulo = await pega(`https://www.youtube.com/oembed?url=${watch}&format=json`)
                  ?? await pega(`https://noembed.com/embed?url=${watch}`);
      if (!titulo) return;
      v.titulo = titulo; mudou = true;
      if (v.edicao == null) {
        const m = titulo.match(/\b([1-7])\s*[ªºa°]\s*edi[çc][ãa]o/i);
        if (m) v.edicao = Number(m[1]);
      }
    }));
    if (mudou) render(false, false);
  }

  const letras = (txt, i0) => [...txt].map((c, k) => `<span class="l" style="--i:${i0 + k}">${c === " " ? "&nbsp;" : esc(c)}</span>`).join("");

  function estrada() {
    return `<section class="estrada-sec" aria-labelledby="t-estrada">
      <div class="envelope">
        <h2 class="titulo" id="t-estrada">A estrada da Rural</h2>

                  <span class="parada__ano">${esc(e.ano)}</span>

            </ol>
          </div>
        </div>
        <p class="estrada__dica">Arraste para o lado para ver todas as edições.</p>
      </div>
    </section>`;
  }

  function ligarEstrada() {
    const box = $("[data-estrada]");
    if (!box) return;
    const rural = $("[data-rural]", box);
    rural.appendChild($("#tpl-rural").content.cloneNode(true));
    const paradas = $$("[data-parada]", box), inicial = paradas[paradas.length - 1];
    const moverPara = a => {
      const t = $(".estrada__trilho", box).getBoundingClientRect(), r = a.getBoundingClientRect();
      rural.style.transform = `translateX(${Math.round(r.left - t.left + r.width / 2 - rural.offsetWidth / 2)}px)`;
    };
    // Posição inicial sem animação; o movimento fica só para a interação.
    rural.style.transition = "none";
    moverPara(inicial);
    rural.getBoundingClientRect();
    rural.style.transition = "";
    paradas.forEach(a => ["mouseenter", "focus"].forEach(ev => a.addEventListener(ev, () => moverPara(a))));
    box._reposicionar = () => moverPara(inicial);
  }

  function blocoSobre(tag = "h2") {
    return `<section class="secao secao--ceu" aria-labelledby="t-sobre">
      <div class="envelope sobre">
        <div>
          <${tag} class="titulo" id="t-sobre">Sobre a mostra</${tag}>
          <div style="margin-top:1.2rem">${P.sobre.map(p => `<p>${esc(p)}</p>`).join("")}</div>

      </div>
    </section>`;
  }

  function blocoLinguagens() {
    return `<section class="secao" aria-labelledby="t-ling">
      <div class="envelope">
        <h2 class="titulo" id="t-ling">O que a Rural leva</h2>
        <p class="intro">Quatro linguagens na mesma tarde, no pátio da escola ou no terreiro da comunidade.</p>
        <div class="linguagens">${P.linguagens.map(l => `
          <article class="linguagem" style="--c:${l.cor};--t:${l.tinta}">

  function faixa() {
    const itens = P.faixa.map(t => `<li>${esc(t)}</li>`).join("");

  /* ---------- Páginas ---------- */
  const paginas = {
    inicio() {
      return `
      <section class="abertura">
        <div class="envelope abertura__grade">
          <div>
            <p class="abertura__pre">${esc(P.subtitulo)}, ${EDS.length} edições</p>

            <p class="abertura__sub">${esc(P.chamada)}</p>
            <p class="abertura__lema">“${esc(P.lema)}”</p>
            <div class="botoes">
              <a class="botao" href="#/edicoes">Ver as ${EDS.length} edições</a>

            </div>
          </div>
          <div class="colagem">
            ${P.colagem.map((id, k) => `<div class="polaroide">${imgDrive(id, 700, "Foto da mostra Vai de Rural", k === 0 ? 'fetchpriority="high" loading="eager"' : "")}</div>`).join("")}
            <span class="selo selo--gratis">Entrada gratuita</span>
            <span class="selo selo--libras">Libras na 7ª edição</span>
          </div>
        </div>
      </section>
      ${faixa()}
      ${estrada()}
      ${blocoLinguagens()}
      ${blocoSobre()}
      <section class="secao secao--rosa" aria-labelledby="t-videos">
        <div class="envelope">
          <h2 class="titulo" id="t-videos">Vídeos</h2>
          <p class="intro">Toque para assistir aqui mesmo.</p>
          <div class="cartoes">${VIDS.slice(0, 6).map(cartaoVideo).join("")}</div>
          <p style="margin-top:2rem"><a class="botao" href="#/videos">Ver todos os ${VIDS.length} vídeos</a></p>
        </div>
      </section>`;
    },

    edicoes() {
      return `<section class="secao" aria-labelledby="t-lista">
        <div class="envelope">
          <h1 class="titulo" id="t-lista">As ${EDS.length} edições</h1>
          <p class="intro">Da primeira viagem pela Bacia do Paramirim até o Baixão.</p>
          <div class="cartoes">
            ${EDS.map(e => {
              const capa = e.fotos[0];

      raiz.setProperty("--cor", e.cor); raiz.setProperty("--tinta", e.tinta);
      return `
      <section class="ed-topo">
        <span class="ed-topo__num" aria-hidden="true">${e.n}</span>
        <div class="envelope">
          <a class="ed-topo__voltar" href="#/edicoes">‹ Todas as edições</a>
          <p class="ed-topo__edicao">${rotuloEd(e)}${e.ano ? `, ${e.ano}` : ""}</p>
          <h1>${esc(e.titulo)}</h1>
          ${e.ficha.length ? `<ul class="ficha">${e.ficha.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}
        </div>
      </section>
      <div class="envelope ed-corpo">
        <div class="ed-texto">${e.texto.map(p => `<p>${esc(p)}</p>`).join("")}</div>
        ${e.pendente ? `<p class="pendente"><strong>Página em montagem.</strong> O texto desta edição será completado com a linha editorial da produção.</p>` : ""}
        <section class="bloco" aria-labelledby="t-fotos">
          <h2 id="t-fotos">Fotos</h2>
          ${e.fotos.length ? `<div class="galeria">${e.fotos.map((f, k) => `
            <figure class="foto ${k === 0 && e.fotos.length > 4 ? "foto--destaque" : ""}">
              <button data-foto="${k}" aria-label="Ampliar: ${esc(legendaFoto(e, f))}">${imgDrive(f.id, k === 0 ? 1100 : 600, legendaFoto(e, f))}</button>
              ${f.legenda ? `<figcaption>${esc(f.legenda)}</figcaption>` : ""}
            </figure>`).join("")}</div>`
          : `<div class="vazio">As fotos desta edição ainda vão ser adicionadas.</div>`}
        </section>
        <section class="bloco" aria-labelledby="t-vids">
          <h2 id="t-vids">Vídeos</h2>
          ${vids.length ? `<div class="cartoes">${vids.map(cartaoVideo).join("")}</div>`
          : `<div class="vazio"><span>Os vídeos desta edição ainda vão ser adicionados. <a href="#/videos">Ver todos os vídeos</a></span></div>`}
        </section>
        <nav class="ed-nav" aria-label="Outras edições">
          ${ant ? `<a href="#/edicao/${ant.n}" style="--c:${ant.cor};--t:${ant.tinta}"><small>‹ Edição anterior</small><strong>${ant.n}ª</strong></a>` : "<span></span>"}
          ${prox ? `<a href="#/edicao/${prox.n}" style="--c:${prox.cor};--t:${prox.tinta}"><small>Próxima edição ›</small><strong>${prox.n}ª</strong></a>` : ""}
        </nav>
      </div>`;
    },

    videos() {
      const comEd = [...new Set(VIDS.map(v => v.edicao).filter(Boolean))].sort((a, b) => a - b);
      return `<section class="secao" aria-labelledby="t-todos">
        <div class="envelope">
          <h1 class="titulo" id="t-todos">Vídeos</h1>
          <p class="intro">Toque em qualquer um para assistir aqui mesmo.</p>
          ${comEd.length ? `<div class="filtros" role="group" aria-label="Filtrar por edição">
            <button class="filtro" data-filtro="" aria-pressed="true">Todos</button>
            ${comEd.map(n => `<button class="filtro" data-filtro="${n}" aria-pressed="false" style="--fc:${ed(n).cor};--t:${ed(n).tinta}">${n}ª edição</button>`).join("")}
          </div>` : ""}
          <div class="cartoes" data-lista-videos>${VIDS.map(cartaoVideo).join("")}</div>
        </div>
      </section>`;
    },

    sobre() { return `${blocoSobre("h1")}${blocoLinguagens()}${estrada()}`; },

    naoEncontrada() {
      return `<section class="secao"><div class="envelope"><h1 class="titulo">Página não encontrada</h1>
        <p class="intro">Esse endereço não existe. <a href="#/">Voltar ao início</a></p></div></section>`;
    }
  };

  /* ---------- Roteador ---------- */
  let edicaoAtual = null, animouTitulo = false;
  function rotaAtual() {
    const partes = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
    if (!partes.length) return { nome: "inicio" };
    if (partes[0] === "edicao") return { nome: "edicao", n: Number(partes[1]) };
    return { nome: ["edicoes", "videos", "sobre"].includes(partes[0]) ? partes[0] : "naoEncontrada" };
  }

  /* focar: rola ao topo e leva o foco ao conteúdo (troca de página).
     Re-render silencioso (títulos dos vídeos chegando) mantém rolagem e foco. */
  function render(focar = false) {
    const r = rotaAtual(), y = window.scrollY;
    const raiz = document.documentElement.style;
    raiz.removeProperty("--cor"); raiz.removeProperty("--tinta");
    edicaoAtual = r.nome === "edicao" ? ed(r.n) : null;
    main.innerHTML = r.nome === "edicao" ? paginas.edicao(r.n) : paginas[r.nome]();
    $$(".menu a").forEach(a => {
      const ativo = a.dataset.rota === r.nome || (r.nome === "edicao" && a.dataset.rota === "edicoes");
      ativo ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
    });
    const h1 = $("h1", main);
    document.title = r.nome === "inicio" ? `${P.nome} — ${P.subtitulo}` : `${h1 ? (h1.getAttribute("aria-label") || h1.textContent) : ""} — ${P.nome}`;
    // O título "pula" só na primeira vez que a página inicial aparece.
    const t = $("[data-titulo]", main);
    if (t && !animouTitulo) { t.classList.add("entrar"); animouTitulo = true; }
    ligarEstrada();
    if (focar) { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
    else window.scrollTo(0, y);
  }
  window.addEventListener("hashchange", () => render(true));
  window.addEventListener("resize", () => { const b = $("[data-estrada]"); b && b._reposicionar && b._reposicionar(); });

  /* ---------- Cliques ---------- */
  main.addEventListener("click", ev => {
    const bFoto = ev.target.closest("[data-foto]");
    if (bFoto && edicaoAtual) return abrirFoto(Number(bFoto.dataset.foto));
    const bVid = ev.target.closest("[data-video]");
    if (bVid) return abrirVideo(VIDS[Number(bVid.dataset.video)]);
    const bFil = ev.target.closest("[data-filtro]");
    if (bFil) {
      const n = bFil.dataset.filtro ? Number(bFil.dataset.filtro) : null;
      $$("[data-filtro]").forEach(b => b.setAttribute("aria-pressed", String(b === bFil)));
      $("[data-lista-videos]").innerHTML = VIDS.filter(v => n == null || v.edicao === n).map(cartaoVideo).join("");
    }
  });

  /* ---------- Janela de foto ---------- */
  const lb = $("#lb"), lbImg = $(".lb__img", lb), lbLeg = $(".lb__legenda", lb);
  let lbIdx = 0;
  function mostrarFoto() {
    const e = edicaoAtual, f = e.fotos[lbIdx];
    lbImg.dataset.drive = f.id; lbImg.dataset.w = 1600; delete lbImg.dataset.tentou;
    lbImg.src = foto(f.id, 1600);
    lbImg.alt = legendaFoto(e, f);
    lbLeg.textContent = `${legendaFoto(e, f)} (${lbIdx + 1} de ${e.fotos.length})`;
    $$("[data-lb]", lb).forEach(b => { b.hidden = e.fotos.length < 2; });
  }
  function abrirFoto(k) { lbIdx = k; mostrarFoto(); lb.showModal(); }
  function passo(d) { const t = edicaoAtual.fotos.length; lbIdx = (lbIdx + d + t) % t; mostrarFoto(); }
  lb.addEventListener("click", ev => {
    const s = ev.target.closest("[data-lb]");
    if (s) return passo(Number(s.dataset.lb));
    if (ev.target.closest("[data-fechar]") || ev.target.classList.contains("janela")) lb.close();
  });
  lb.addEventListener("keydown", ev => {
    if (ev.key === "ArrowRight") passo(1);
    if (ev.key === "ArrowLeft") passo(-1);
  });
  let x0 = null;
  lb.addEventListener("touchstart", ev => { x0 = ev.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", ev => {
    if (x0 == null) return;
    const dx = ev.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) passo(dx < 0 ? 1 : -1);
  });

  /* ---------- Janela de vídeo ----------
     youtube-nocookie: sem cookies de rastreamento antes do play.
     O iframe é removido ao fechar, senão o áudio continua tocando. */
  const vd = $("#vd"), vdQuadro = $(".vd__quadro", vd);
  function abrirVideo(v) {
    vdQuadro.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?autoplay=1&rel=0"
      title="${esc(tituloVideo(v))}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    $(".vd__titulo", vd).textContent = tituloVideo(v);
    $(".vd__link", vd).href = `https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}`;
    vd.showModal();
  }
  vd.addEventListener("close", () => { vdQuadro.innerHTML = ""; });
  vd.addEventListener("click", ev => {
    if (ev.target.closest("[data-fechar]") || ev.target.classList.contains("janela")) vd.close();
  });

  /* ---------- Elementos fixos ---------- */
  (function bandeirinhas() {
    const svg = $("[data-bandeirinhas]"), cores = EDS.map(e => e.cor), w = 1200 / 40;
    let d = "";
    for (let k = 0; k < 40; k++) d += `<path d="M${k * w} 0h${w - 3}l-${(w - 3) / 2} 20z" fill="${cores[k % cores.length]}"/>`;
    svg.innerHTML = `<rect width="1200" height="2" fill="#151d4d"/>${d}`;
  })();
  $("[data-parceiros]").innerHTML = P.parceiros.map(([t, n]) => `<div><dt>${esc(t)}</dt><dd>${esc(n)}</dd></div>`).join("");
  $("[data-contato]").innerHTML = `<a href="mailto:${esc(P.contato)}">${esc(P.contato)}</a>`;

  render();
  carregarTitulos();
})();
</script>
</body>
</html>
