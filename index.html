<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Vai de Rural — Mostra Cultural Itinerante</title>
<meta name="description" content="Sete edições levando cinema, circo, fotografia e cultura popular a comunidades rurais e quilombolas da Bahia.">
<meta name="theme-color" content="#ffc21a">
<!-- Prévia ao compartilhar no WhatsApp/redes: a imagem precisa de endereço absoluto -->
<meta property="og:type" content="website">

<meta property="og:title" content="Vai de Rural — Mostra Cultural Itinerante">
<meta property="og:description" content="Sete edições levando cinema, circo, fotografia e cultura popular a comunidades rurais e quilombolas da Bahia.">
<meta property="og:image" content="https://rafeiguer.github.io/vai-de-rural/assets/og.jpg">

<style>
/* =========================================================================
   TOKENS
   Alfa Slab One: serifa quadrada e grossa de cartaz de circo e feira, só para
   títulos e números grandes (tem um peso só).
   Baloo 2: texto e interface; arredondada e alegre, com pesos de 400 a 800
   e boa leitura no celular.
   Cada edição tem cor própria (nos dados). A cor do texto sobre ela é
   calculada no JS para manter contraste legível.
   ========================================================================= */
:root {
  --anil: #1f2a6b;
  --noite: #151d4d;
  --sol: #ffc21a;
  --urucum: #e8452c;
  --rosa: #ff5c9a;
  --ceu: #29a8e0;
  --mato: #1f9d62;
  --papel: #ffffff;
  --texto: #1b1f3a;
  --texto-2: #4a4f6e;
  --borda: #e6e2f0;
  --raio: 18px;
  --display: "Alfa Slab One", "Rockwell", "Georgia", serif;
  --corpo: "Baloo 2", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --largura: 1200px;
  --cor: var(--anil);
  --tinta: #fff;
  /* Intensidade dos cartazes de fundo (0 = some, 1 = cor original). Ajuste só aqui. */
  --fundo-opacidade: 0.9;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--papel); color: var(--texto);
  font: 400 1.0625rem/1.6 var(--corpo); font-optical-sizing: auto;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--rosa); outline-offset: 3px; border-radius: 6px; }
.envelope { width: min(100% - 2.5rem, var(--largura)); margin-inline: auto; }
h1, h2, h3 { margin: 0; line-height: 1.02; }
.display { font-family: var(--display); font-weight: 400; letter-spacing: .005em; }
.titulo { font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 6vw, 3.6rem); color: var(--anil); }
.intro { font-size: 1.15rem; color: var(--texto-2); max-width: 58ch; margin: .9rem 0 0; }

/* ---------- Cabeçalho ---------- */
.topo { position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px); background: var(--anil); color: #fff; }
.topo__linha { display: flex; align-items: center; gap: 1rem; min-height: 64px; }
.marca { font-family: var(--display); font-size: 1.45rem; text-decoration: none; white-space: nowrap; color: var(--sol); }
.menu { margin-left: auto; display: flex; gap: .25rem; }
.menu a { text-decoration: none; font-weight: 700; font-size: .98rem; padding: .45rem .85rem; border-radius: 999px; white-space: nowrap; }
.menu a:hover { background: rgba(255,255,255,.12); }
.menu a[aria-current="page"] { background: var(--sol); color: var(--anil); }
/* Com seis itens, marca e menu deixam de caber lado a lado abaixo de ~700 px: o menu desce para a linha de baixo. */
@media (max-width: 720px) {
  .topo__linha { flex-wrap: wrap; gap: .1rem; padding: .5rem 0 .45rem; min-height: 0; }
  /* Seis itens não cabem numa linha de celular: quebram em duas, centralizadas. */
  .menu { margin-left: 0; width: 100%; flex-wrap: wrap; justify-content: center; gap: .15rem .1rem; }
  .menu a { padding: .35rem .5rem; font-size: .9rem; }
}
.bandeirinhas { display: block; width: 100%; height: 22px; transform-origin: top; }

/* ---------- Abertura ---------- */
.abertura { background: var(--sol); padding: clamp(2.5rem, 6vw, 4.5rem) 0 clamp(3.5rem, 7vw, 5.5rem); overflow: hidden; position: relative; }
.abertura__grade { display: grid; gap: 3rem; align-items: center; }
@media (min-width: 920px) { .abertura__grade { grid-template-columns: 1.1fr 1fr; } }
.abertura__pre { font-weight: 800; font-stretch: 80%; font-size: 1.05rem; color: var(--anil); margin: 0 0 .5rem; }
.abertura h1 { font-family: var(--display); font-weight: 400; color: var(--anil); font-size: clamp(3.6rem, 13vw, 8.4rem); line-height: .92; }
.abertura h1 .l { display: inline-block; }
.abertura h1 .rural .l:nth-child(1) { color: var(--urucum); }
.abertura h1 .rural .l:nth-child(2) { color: var(--rosa); }
.abertura h1 .rural .l:nth-child(3) { color: var(--ceu); }
.abertura h1 .rural .l:nth-child(4) { color: var(--mato); }
.abertura h1 .rural .l:nth-child(5) { color: #6e4bc0; }
.abertura__sub { font-size: clamp(1.15rem, 2.3vw, 1.45rem); font-weight: 600; line-height: 1.4; margin: 1.4rem 0 .4rem; max-width: 30ch; color: var(--anil); }
.botoes { display: flex; flex-wrap: wrap; gap: .75rem; }
.botao {
  display: inline-flex; align-items: center; text-decoration: none; border: 0;
  font-weight: 800; padding: .9rem 1.4rem; border-radius: 999px;
  background: var(--anil); color: #fff; box-shadow: 0 4px 0 var(--noite);
  transition: transform .12s ease, box-shadow .12s ease;
}
.botao:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--noite); }
.botao:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--noite); }
.botao--branco { background: #fff; color: var(--anil); }

/* Colagem de fotos tipo polaroide */
.colagem { position: relative; min-height: 360px; }
@media (min-width: 920px) { .colagem { min-height: 480px; } }
.polaroide {
  position: absolute; background: #fff; padding: 10px 10px 34px; border-radius: 6px;
  box-shadow: 0 14px 30px rgba(31, 42, 107, .25); transition: transform .3s ease;
}
.polaroide img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #efeaf8; border-radius: 3px; }
.polaroide:nth-child(1) { width: 58%; left: 0; top: 6%; transform: rotate(-6deg); z-index: 2; }
.polaroide:nth-child(2) { width: 50%; right: 0; top: 0; transform: rotate(5deg); }
.polaroide:nth-child(3) { width: 46%; right: 8%; bottom: 0; transform: rotate(-2deg); z-index: 3; }
.polaroide:hover { transform: rotate(0) scale(1.03); z-index: 5; }

/* Por onde a Rural passou: as paradas da edição, numeradas em sequência como uma rota. */
.locais-bloco { margin-bottom: 2.4rem; }
.locais-bloco h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.6rem, 4vw, 2.2rem); color: #fff; text-shadow: var(--t-halo, none); }
.locais { list-style: none; counter-reset: parada; display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin: 1.2rem 0 0; padding: 0; }
.locais li {
  counter-increment: parada; position: relative; display: grid; gap: .1rem; padding: .85rem 1rem .85rem 3.6rem;
  border-radius: var(--raio); background: var(--vidro, rgba(11, 16, 51, .62)); border: 2px solid var(--cor); color: #fff;
}
.locais__pino {
  position: absolute; left: .8rem; top: 50%; translate: 0 -50%; display: grid; place-items: center; width: 2.1rem; height: 2.1rem;
  border-radius: 50% 50% 50% 0; rotate: -45deg; background: var(--cor);
}
.locais__pino::after { content: counter(parada); rotate: 45deg; color: var(--tinta); font-weight: 800; font-size: .95rem; }
.locais strong { font-size: 1.05rem; line-height: 1.25; }
.locais li > span:not(.locais__pino) { font-size: .9rem; color: #e3e6f7; }
.locais li > .locais__mais { font-size: .8rem; font-weight: 700; color: var(--cor); }

/* Texto sobre a comunidade: sempre aberto, abaixo das paradas, com a borda na cor da edição. */
/* Texto longo: fundo mais fechado e desfocado que o dos cartões, para o desenho do fundo não cruzar as letras. */
.comunidade {
  margin-top: .9rem; border-radius: var(--raio); background: rgba(11, 16, 51, .88);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  border: 2px solid var(--cor); color: #fff;
}
.comunidade__titulo {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .7rem; margin: 0;
  padding: 1rem 1.1rem .6rem; font-family: var(--display); font-weight: 400; font-size: clamp(1.25rem, 3.2vw, 1.6rem);
}
.comunidade__titulo span { font-family: var(--corpo); font-size: .9rem; color: #e3e6f7; }
.comunidade__texto { padding: 0 1.1rem .4rem; max-width: 68ch; font-size: 1.05rem; line-height: 1.7; }
.comunidade__texto p { margin: 0 0 1rem; }

/* Carrossel da abertura (posições --cx, --cy, --cs, --cr vindas do JS a cada quadro). */
.carrossel { position: relative; min-height: 360px; }
@media (min-width: 920px) { .carrossel { min-height: 480px; } }
.carrossel__foto {
  position: absolute; left: 50%; top: 50%; width: 52%; text-decoration: none;
  padding: 10px 10px 30px; border-radius: 6px; background: #efe8da; box-shadow: 0 14px 30px rgba(0, 0, 0, .35);
  transform: translate(-50%, -50%) translate(var(--cx, 0), var(--cy, 0)) scale(var(--cs, 1)) rotate(var(--cr, 0));
  will-change: transform, opacity;
}
.carrossel__foto:hover { transform: translate(-50%, -50%) translate(var(--cx, 0), var(--cy, 0)) scale(calc(var(--cs, 1) * 1.04)) rotate(0deg); }
.carrossel__ed {
  position: absolute; top: -12px; left: -12px; display: grid; place-items: center; width: 2.6em; height: 2.6em;
  /* Cor única (anil) com número branco em todas as edições, para não competir com as cores das fotos. */
  border-radius: 50%; border: 3px solid #fff; background: var(--anil); color: #fff; font-family: var(--display); font-size: 1.05rem;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .3);
}
.carrossel__foto img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 3px; filter: brightness(.92) contrast(1.06) saturate(1.1); }
@media (max-width: 600px) { .carrossel__foto { width: 60%; } }

/* Baralho da página Edições: cartas espalhadas na mesa (posições em --x, --y, --r, --z, vindas do JS).
   A mesa tem proporção 5:4 e a carta 3:4 com 40% da largura, então cabem com folga de x 0–60% e y 0–33%. */
.baralho-mesa { display: grid; justify-items: center; gap: 1rem; }
.baralho { position: relative; width: min(100%, 560px); aspect-ratio: 5 / 4; }
.carta {
  position: absolute; left: var(--x, 30%); top: var(--y, 16%); z-index: var(--z, 1);
  width: 40%; aspect-ratio: 3 / 4; padding: 7px; border-radius: 14px; background: #fff; text-decoration: none;
  transform: rotate(var(--r, 0deg)); box-shadow: 0 10px 24px rgba(21, 29, 77, .28);
  transition: left .7s cubic-bezier(.2, .8, .2, 1) var(--atraso, 0ms), top .7s cubic-bezier(.2, .8, .2, 1) var(--atraso, 0ms),
              transform .45s cubic-bezier(.3, 1.4, .5, 1) var(--atraso, 0ms), box-shadow .25s ease;
}
.carta:hover, .carta:focus-visible { z-index: 30; transform: rotate(0deg) translateY(-12px) scale(1.07); box-shadow: 0 20px 40px rgba(21, 29, 77, .35); }
.carta__foto { display: block; width: 100%; height: 100%; border-radius: 9px; overflow: hidden; background: var(--c); }
.carta__foto img { width: 100%; height: 100%; object-fit: cover; }
/* O número é o destaque: grande, na cor da edição, com borda branca para descolar da foto. */
.carta__num {
  position: absolute; top: 12px; left: 12px; display: grid; place-items: center;
  min-width: 2.3em; height: 2.3em; padding: 0 .25em; border-radius: 999px; border: 3px solid #fff;
  background: var(--anil); color: #fff; font-family: var(--display); font-size: clamp(1.25rem, 3.6vw, 2.1rem); line-height: 1;
  box-shadow: 0 3px 10px rgba(0, 0, 0, .3);
}
.carta__ano {
  position: absolute; left: 12px; bottom: 12px; padding: .1rem .55rem; border-radius: 999px;
  background: rgba(255, 255, 255, .92); color: var(--texto); font-weight: 800; font-size: .8rem;
}
.baralho__embaralhar { position: relative; z-index: 31; }

/* Leitor de releases: uma página grande por vez, numa moldura branca com a cor da edição (--c),
   que "vira" ao trocar (vira-prox / vira-ant); embaixo, as miniaturas soltas como papéis na mesa. */
.abertura.abertura--curta { padding-bottom: .5rem; }
.secao.leitor-sec { padding-top: 1rem; }
.leitor { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: clamp(.3rem, 2vw, 1.2rem); margin-top: 1.4rem; }
.leitor__pagina { margin: 0; display: grid; justify-items: center; gap: .8rem; }
.leitor__folha {
  border: 0; padding: 8px; background: #fff; border-radius: 10px; cursor: zoom-in; max-width: 100%;
  box-shadow: 0 0 0 5px var(--c, var(--sol)), 0 22px 48px rgba(0, 0, 0, .45);
  transform: rotate(-1deg); transition: transform .25s ease;
}
.leitor__folha:hover { transform: rotate(0deg) scale(1.01); }
.leitor__folha img { display: block; width: auto; max-width: 100%; max-height: min(78vh, 920px); border-radius: 4px; }
.leitor__folha.vira-prox { transform-origin: left center; animation: vira-prox .55s cubic-bezier(.2, .8, .2, 1); }
.leitor__folha.vira-ant { transform-origin: right center; animation: vira-ant .55s cubic-bezier(.2, .8, .2, 1); }
@keyframes vira-prox { from { transform: perspective(1600px) rotateY(-80deg) translateX(18%); opacity: .15; } to { transform: perspective(1600px) rotateY(0) rotate(-1deg); opacity: 1; } }
@keyframes vira-ant { from { transform: perspective(1600px) rotateY(80deg) translateX(-18%); opacity: .15; } to { transform: perspective(1600px) rotateY(0) rotate(-1deg); opacity: 1; } }
.leitor__seta {
  width: clamp(44px, 6vw, 60px); height: clamp(44px, 6vw, 60px); border-radius: 50%; border: 3px solid #fff;
  background: var(--sol); color: var(--anil); font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 800; line-height: 1;
  box-shadow: 0 4px 0 #b88400; transition: transform .2s cubic-bezier(.3, 1.6, .5, 1);
}
.leitor__seta:hover { transform: scale(1.12) rotate(-8deg); }
.leitor__seta:active { transform: translateY(3px); box-shadow: 0 1px 0 #b88400; }
.leitor__legenda { font-weight: 800; color: #fff; text-shadow: 0 0 6px #0a0e2d, 0 0 14px #0a0e2d; }
.leitor__miniaturas { display: flex; gap: .8rem; overflow-x: auto; padding: 3.6rem 1.4rem 1.6rem; margin-top: 1.2rem; scrollbar-width: thin; }
.leitor__mini {
  flex: none; position: relative; width: 84px; padding: 4px; border: 0; border-radius: 6px; background: #fff; opacity: .78;
  transform: rotate(-2.5deg); transition: transform .2s ease, opacity .2s ease, box-shadow .2s ease;
}
.leitor__mini:nth-child(even) { transform: rotate(2.5deg); }

.leitor__mini img { display: block; width: 100%; height: auto; border-radius: 3px; }
.leitor__mini span {
  position: absolute; top: -9px; left: -9px; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
  background: var(--sol); color: var(--anil); font-weight: 800; font-size: .8rem;
}
.leitor__mini:hover { opacity: 1; transform: rotate(0deg) translateY(-4px); }
.leitor__mini[aria-current] { opacity: 1; transform: rotate(0deg) translateY(-6px) scale(1.08); box-shadow: 0 0 0 3px var(--c, var(--sol)); }
.leitor__dica { margin: .6rem 0 0; text-align: center; font-size: .92rem; color: #fff; text-shadow: 0 0 6px #0a0e2d; }

/* Ouvir: botões de leitura em voz alta. Amarelos com ícone de alto-falante, fáceis de achar mesmo para
   quem não lê. O trecho sendo lido ganha um realce (.lendo). */
.ouvir {
  display: inline-flex; align-items: center; gap: .45rem; border: 0; border-radius: 999px; cursor: pointer;
  padding: .45rem 1rem .45rem .8rem; background: var(--sol); color: var(--anil); font-weight: 800; font-size: .95rem;
  box-shadow: 0 3px 0 #b88400; transition: transform .15s ease;
}
.ouvir[hidden] { display: none; }
.ouvir svg { width: 1.35em; height: 1.35em; flex: none; }
.ouvir:hover { transform: translateY(-2px); }
.ouvir[aria-pressed="true"] { background: var(--rosa); color: #fff; box-shadow: 0 3px 0 #b8386c; }
.ouvir[aria-pressed="true"] svg { animation: fala-pulsa .7s ease-in-out infinite alternate; }
@keyframes fala-pulsa { to { transform: scale(1.18); } }
.painel > .ouvir, .ed-texto > .ouvir { margin: 0 0 .9rem; }
.ouvir--grande { font-size: 1.15rem; padding: .75rem 1.4rem .75rem 1.1rem; }
.ouvir--pagina {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  box-shadow: 0 3px 0 #b88400, 0 10px 24px rgba(0, 0, 0, .35);
}
.lendo { background: rgba(255, 194, 26, .22); box-shadow: 0 0 0 4px rgba(255, 194, 26, .22); border-radius: 6px; }
.resumo__texto { max-width: 68ch; margin-top: 1.4rem; font-size: 1.15rem; line-height: 1.7; }
/* No celular, o "Ouvir a página" vira um círculo só com o alto-falante, para cobrir menos texto. */
@media (max-width: 600px) {
  .ouvir--pagina { width: 58px; height: 58px; padding: 0; justify-content: center; }
  .ouvir--pagina svg { width: 28px; height: 28px; }
  .ouvir--pagina span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
.resumo__texto p { margin: 0 0 .9rem; }

/* Animação de entrada do título (junto com a distribuição do baralho, os únicos movimentos automáticos do site) */
@keyframes pula {
  0% { opacity: 0; transform: translateY(40%) scale(.6) rotate(-8deg); }
  60% { opacity: 1; transform: translateY(-6%) scale(1.08) rotate(3deg); }
  100% { opacity: 1; transform: none; }
}
.entrar .l { animation: pula .6s cubic-bezier(.3, 1.4, .5, 1) both; animation-delay: calc(var(--i) * 45ms); }

/* ---------- Faixa corrida ---------- */
.faixa { background: var(--anil); color: #fff; overflow: hidden; padding: .9rem 0; border-block: 4px solid var(--rosa); }
.faixa__trilha { display: flex; width: max-content; animation: corre 45s linear infinite; }
.faixa:hover .faixa__trilha { animation-play-state: paused; }
.faixa ul { display: flex; list-style: none; margin: 0; padding: 0; }
.faixa li { font-family: var(--display); font-size: clamp(1.2rem, 2.6vw, 1.7rem); white-space: nowrap; padding-right: 2.2rem; }
.faixa li::after { content: "✦"; color: var(--sol); margin-left: 2.2rem; font-family: var(--corpo); }
@keyframes corre { to { transform: translateX(-50%); } }

/* ---------- Estrada ---------- */
.estrada-sec { background: var(--anil); color: #fff; padding: clamp(3rem, 7vw, 4.5rem) 0 3rem; overflow: hidden; }
.estrada-sec .titulo { color: var(--sol); }
.estrada-sec .intro { color: #cfd4f3; }
.estrada { position: relative; margin-top: 2rem; overflow-x: auto; overscroll-behavior-x: contain; padding-bottom: .5rem; scrollbar-width: thin; }
.estrada__trilho { position: relative; min-width: 880px; padding-top: 122px; }
.estrada__asfalto { position: absolute; left: 0; right: 0; top: 154px; height: 28px; border-radius: 14px; background: var(--noite); }
.estrada__asfalto::after {
  content: ""; position: absolute; left: 14px; right: 14px; top: 12px; height: 4px;
  background: repeating-linear-gradient(90deg, var(--sol) 0 24px, transparent 24px 44px);
}
.estrada__paradas { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); list-style: none; margin: 0; padding: 0; }
.parada { text-align: center; }
.parada a { display: inline-flex; flex-direction: column; align-items: center; gap: .6rem; text-decoration: none; padding: .25rem; border-radius: 12px; }
.parada__num {
  width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center;
  background: var(--c); color: var(--t, #fff); font-family: var(--display); font-size: 2.3rem;
  box-shadow: 0 0 0 6px var(--anil), 0 0 0 10px var(--c); transition: transform .2s cubic-bezier(.3, 1.6, .5, 1);
}
.parada a:hover .parada__num, .parada a:focus-visible .parada__num { transform: scale(1.12) rotate(-6deg); }
.parada__local { font-weight: 700; font-size: .92rem; line-height: 1.25; max-width: 15ch; }
.parada__ano { font-size: .82rem; color: #aab2e6; min-height: 1.2em; }
/* A Rural da estrada é o desenho de Pablo Sant'Ana do release da 3ª edição (assets/rural-3a.webp). */
.estrada__rural { position: absolute; top: 12px; left: 0; width: 150px; transition: transform .8s cubic-bezier(.5, 0, .2, 1); pointer-events: none; }
.estrada__rural img { width: 100%; height: auto; display: block; }.estrada__dica { font-size: .85rem; color: #aab2e6; margin-top: .5rem; }
@media (min-width: 920px) { .estrada__dica { display: none; } }

/* ---------- Seções ---------- */
.secao { padding: clamp(3.5rem, 8vw, 6rem) 0; }
.secao--rosa { background: #ffe3ee; }
.secao--ceu { background: #e2f4fc; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Abertura das páginas internas: mesma linguagem da home, mais compacta */
.abertura--pagina { padding: clamp(2rem, 5vw, 3.5rem) 0 clamp(3rem, 6vw, 4.5rem); }
.abertura--pagina h1 { font-size: clamp(3rem, 10vw, 6.2rem); }
.abertura--pagina .abertura__sub { margin-top: 1.1rem; }
.abertura--pagina .colagem { min-height: 300px; }
@media (min-width: 920px) { .abertura--pagina .colagem { min-height: 380px; } }
.abertura h1 .rural .l:nth-child(6) { color: #f47b20; }
.abertura h1 .rural .l:nth-child(7) { color: var(--urucum); }
.polaroide__arte {
  aspect-ratio: 1; border-radius: 3px; display: grid; place-items: center;
  background: var(--c); color: var(--t); font-family: var(--display); font-size: clamp(3rem, 8vw, 5.2rem);
}
.polaroide__arte svg { width: 34%; height: auto; }

/* Faixa de convite no fim das páginas */
.secao.chamada { padding: clamp(2.5rem, 6vw, 3.5rem) 0; }
.chamada__grade { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1.4rem 2rem; }
.chamada .titulo { font-size: clamp(1.8rem, 4.5vw, 2.6rem); }
/* Sobre os cartazes, a faixa de convite vira um painel claro: o texto escuro não se lê sobre rostos e cores escuras. */
body.com-fundo .chamada__grade { background: var(--vidro); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-radius: var(--raio); padding: 1.4rem 1.6rem; }
body.com-fundo .chamada :is(.titulo, .intro) { text-shadow: none; }
body.com-fundo .painel { background: var(--vidro); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; border-radius: var(--raio); padding: 1.1rem 1.4rem .6rem; }
body.com-fundo .painel p { text-shadow: none; }
/* Texto corrido longo (página Sobre): linha de leitura confortável, parágrafos bem separados. */
.texto-longo { font-size: 1.15rem; line-height: 1.7; max-width: 68ch; margin-inline: auto; }
.texto-longo p { margin: 0 0 1.2rem; }
body.com-fundo .painel.texto-longo { padding: clamp(1.4rem, 4vw, 2.4rem) clamp(1.2rem, 4vw, 2.6rem) clamp(.4rem, 2vw, 1.2rem); }
/* Texto branco sobre um véu roxo semitransparente: o cartaz aparece por trás, desfocado para não
   misturar cores com as letras. Com alfa .78, o branco fica em ~5.5:1 mesmo sobre a parte mais clara do cartaz
   (com .7 ou menos, deixa de passar 4.5:1). */
body.com-fundo .painel.texto-longo {
  background: rgba(75, 45, 143, .78); color: #fff; font-weight: 500;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  box-shadow: 0 10px 30px rgba(10, 14, 45, .25);
}

/* O que a Rural leva */
.linguagens { display: grid; gap: 1rem; margin-top: 2.25rem; grid-template-columns: 1fr; }
@media (min-width: 640px) { .linguagens { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1000px) { .linguagens { grid-template-columns: repeat(4, 1fr); } }
.linguagem { border-radius: var(--raio); padding: 1.6rem 1.4rem 1.5rem; background: var(--c); color: var(--t); transition: transform .2s ease; }
.linguagem:nth-child(odd) { transform: rotate(-1.2deg); }
.linguagem:nth-child(even) { transform: rotate(1.2deg); }
.linguagem:hover { transform: rotate(0) translateY(-4px); }
.linguagem h3 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; margin-bottom: .6rem; }
.linguagem p { margin: 0; font-weight: 500; }

/* Sobre + fatos */
.sobre { display: grid; gap: 2.5rem; }
@media (min-width: 920px) { .sobre { grid-template-columns: 1.3fr 1fr; align-items: center; } }
.sobre p { max-width: 62ch; margin: 0 0 1rem; font-size: 1.1rem; }
.fatos { display: grid; gap: .9rem; margin: 0; }
.fatos div { display: flex; align-items: baseline; gap: 1rem; background: #fff; border-radius: var(--raio); padding: 1rem 1.3rem; border: 3px solid var(--anil); box-shadow: 5px 5px 0 var(--anil); }
.fatos dd { order: -1; margin: 0; font-family: var(--display); font-size: 2.6rem; color: var(--urucum); line-height: 1; min-width: 3.2ch; }
.fatos dt { font-weight: 700; font-size: 1.05rem; }

/* ---------- Cartões (vídeos e edições) ---------- */
.cartoes { display: grid; gap: 1.4rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); margin-top: 2rem; }
.cartao {
  display: flex; flex-direction: column; text-align: left; padding: 0; text-decoration: none;
  background: #fff; border-radius: var(--raio); overflow: hidden; border: 3px solid var(--anil);
  box-shadow: 5px 5px 0 var(--vc, var(--anil)); transition: transform .15s ease, box-shadow .15s ease;
}
.cartao:hover { transform: translate(-3px, -3px); box-shadow: 8px 8px 0 var(--vc, var(--anil)); }
.cartao__capa { position: relative; aspect-ratio: 16 / 9; background: var(--vc, var(--noite)); overflow: hidden; border-bottom: 3px solid var(--anil); }
.cartao__capa img { width: 100%; height: 100%; object-fit: cover; }
/* Cartaz como capa: o recorte 16:9 puxa para cima do centro, onde costumam ficar o título e a arte. */
.cartao__capa img.cartao__cartaz { object-position: center 30%; }
.cartao__num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 5rem; color: var(--t, #fff); }
.cartao__play {
  position: absolute; inset: 0; margin: auto; width: 64px; height: 64px; border-radius: 50%;
  background: var(--sol); display: grid; place-items: center; border: 3px solid var(--anil);
  transition: transform .2s cubic-bezier(.3, 1.6, .5, 1);
}
.cartao:hover .cartao__play { transform: scale(1.15); }
.cartao__play svg { width: 24px; height: 24px; fill: var(--anil); margin-left: 4px; }
.cartao__info { padding: .9rem 1.05rem 1.1rem; display: grid; gap: .35rem; }
.cartao__titulo { font-weight: 800; font-size: 1.05rem; line-height: 1.3; }
.cartao__etiqueta { font-size: .85rem; font-weight: 700; font-stretch: 85%; color: var(--texto-2); display: flex; align-items: center; gap: .45rem; }
.cartao__etiqueta::before { content: ""; width: .75rem; height: .75rem; border-radius: 50%; background: var(--vc, var(--anil)); flex: none; }

/* Tripulantes: cartão com retrato 4:5; sem foto, as iniciais na cor do cartão. */
/* Tripulantes agrupados por edição: título com o número na cor da edição, e a equipe e os convidados em grades. */
.trip-ed + .trip-ed { margin-top: 3rem; }
.trip-ed__titulo { font-family: var(--display); font-weight: 400; font-size: clamp(1.5rem, 3.6vw, 2.1rem); }
.trip-ed__titulo a { color: #fff; text-decoration: none; text-shadow: var(--t-halo, none); }
.trip-ed__num { display: inline-grid; place-items: center; min-width: 2.2em; height: 2.2em; margin-right: .3rem; border-radius: 50%; border: 3px solid #fff; background: var(--vc); color: var(--t); font-size: .8em; text-shadow: none; vertical-align: middle; }
.trip-ed__grupo { margin: 1.4rem 0 0; font-size: 1.05rem; font-weight: 800; color: #fff; text-shadow: var(--t-halo, none); }
.trip-ed__cartoes { margin-top: .8rem; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.tripulante { cursor: default; }
.tripulante:hover { transform: none; box-shadow: 5px 5px 0 var(--vc, var(--anil)); }
.tripulante .cartao__capa { aspect-ratio: 4 / 5; }
.tripulante .cartao__capa img { object-position: center 25%; }
.tripulante .cartao__num { font-size: clamp(3.5rem, 12vw, 5.5rem); }
/* "Tripulantes" é a palavra mais longa dos títulos: fonte um pouco menor e sem quebra entre as letras. */
.abertura--pagina h1#t-trip { font-size: clamp(2.6rem, 8vw, 5.2rem); }
#t-trip .rural { white-space: nowrap; }
/* Artistas na estrada: foto em destaque + miniaturas à esquerda, texto ao lado (embaixo, no celular). */
.artistas { display: grid; gap: 1.4rem; margin-top: 1.6rem; }
.artista {
  display: grid; gap: 1rem 1.6rem; padding: 1rem; border-radius: var(--raio);
  background: rgba(255, 255, 255, .94); border: 3px solid var(--anil); box-shadow: 5px 5px 0 var(--anil); color: var(--texto);
}
@media (min-width: 760px) { .artista { grid-template-columns: minmax(0, 340px) 1fr; align-items: start; } }
.artista button { display: block; width: 100%; padding: 0; border: 0; background: none; border-radius: 6px; overflow: hidden; }
.artista img { display: block; width: 100%; object-fit: cover; }
.artista__destaque img { aspect-ratio: 4 / 5; }
.artista__mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: .4rem; margin-top: .5rem; }
.artista__mini img { aspect-ratio: 1; }
.artista button:hover img, .artista button:focus-visible img { opacity: .85; }
.artista__texto { align-self: stretch; display: grid; align-content: start; gap: .6rem; padding: .4rem .2rem; }
.artista__texto h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(1.6rem, 4vw, 2.2rem); color: var(--anil); }
.artista__texto p { margin: 0; font-size: 1.05rem; line-height: 1.65; max-width: 60ch; }
/* Sem nome ainda: caixa tracejada indicando o espaço a preencher. */
.artista__texto--vazio { border: 3px dashed #b9bfe0; border-radius: var(--raio); padding: 1.2rem; min-height: 12rem; color: #6b7095; }
.artista__texto--vazio h3 { color: #6b7095; }
.artista__texto--vazio h3.artista__nome { color: var(--anil); }
.tripulante__texto { margin: .25rem 0 0; font-size: .95rem; line-height: 1.5; color: var(--texto-2); }

.filtros { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; }
.filtro { border: 3px solid var(--anil); background: #fff; border-radius: 999px; padding: .4rem 1rem; font-weight: 700; }
.filtro[aria-pressed="true"] { background: var(--fc, var(--anil)); color: var(--t, #fff); }

/* ---------- Página de edição ---------- */
.ed-topo { background: var(--cor); color: var(--tinta); padding: clamp(2.5rem, 6vw, 4.5rem) 0 clamp(2.2rem, 5vw, 3.2rem); position: relative; overflow: hidden; }
.ed-topo__num {
  position: absolute; right: .02em; bottom: -.2em; font-family: var(--display);
  font-size: clamp(11rem, 36vw, 26rem); line-height: 1; opacity: .16; pointer-events: none; user-select: none;
}
.ed-topo__voltar { display: inline-block; font-weight: 700; margin-bottom: 1.2rem; text-decoration: none; }
.ed-topo__voltar:hover { text-decoration: underline; }
.ed-topo__edicao { font-weight: 800; font-stretch: 80%; font-size: 1.15rem; margin: 0 0 .35rem; }
.ed-topo h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.4rem, 7vw, 4.8rem); max-width: 17ch; position: relative; }
.ficha { display: flex; flex-wrap: wrap; gap: .55rem; margin: 1.5rem 0 0; padding: 0; list-style: none; position: relative; }
.ficha li { background: rgba(255,255,255,.25); border: 2px solid currentColor; padding: .4rem .9rem; border-radius: 999px; font-weight: 700; font-size: .92rem; }
.ed-corpo { padding: clamp(2.5rem, 6vw, 4rem) 0; }
.ed-texto p { max-width: 64ch; margin: 0 0 1rem; font-size: 1.15rem; }
.pendente { border: 3px dashed var(--anil); border-radius: var(--raio); padding: 1rem 1.2rem; margin: 1.5rem 0; max-width: 64ch; color: var(--texto-2); background: #fffbea; }
.pendente strong { color: var(--texto); }
.bloco { margin-top: 3.2rem; }
.bloco h2 { font-family: var(--display); font-weight: 400; font-size: clamp(1.9rem, 4.5vw, 2.6rem); color: var(--anil); }
.bloco h2::after { content: ""; display: block; width: 4rem; height: 7px; border-radius: 4px; background: var(--cor); margin-top: .45rem; }

/* Galeria em polaroides */
.galeria { display: grid; gap: 1.4rem 1rem; grid-template-columns: repeat(2, 1fr); margin-top: 1.6rem; }
@media (min-width: 700px) { .galeria { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1040px) { .galeria { grid-template-columns: repeat(4, 1fr); } }
.foto { margin: 0; }
.foto button {
  display: block; width: 100%; border: 0; background: #fff; padding: 8px 8px 10px; border-radius: 6px;
  box-shadow: 0 8px 20px rgba(31, 42, 107, .16); transition: transform .25s ease;
}
.foto:nth-child(3n+1) button { transform: rotate(-1.8deg); }
.foto:nth-child(3n+2) button { transform: rotate(1.4deg); }
.foto:nth-child(3n) button { transform: rotate(-.6deg); }
.foto button:hover { transform: rotate(0) scale(1.04); }
.foto img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #efeaf8; border-radius: 3px; }
.foto figcaption { font-size: .85rem; color: var(--texto-2); padding: .45rem .2rem 0; line-height: 1.35; }
.foto--destaque { grid-column: span 2; }
/* Cartaz da edição: polaroide única, na proporção original (cartazes são retrato ou paisagem). */
.cartaz-ed { max-width: min(100%, 420px); margin-top: 1.6rem; }
.cartaz-ed img { aspect-ratio: auto; object-fit: contain; }
.foto--destaque img { aspect-ratio: 16 / 10; }
/* Release: páginas do PDF lado a lado, na proporção original, sem a inclinação das polaroides
   (é um documento para ler). Na ampliação, a página ocupa a altura toda da tela. */
.bloco__dica { margin: .9rem 0 0; color: var(--texto-2); font-weight: 600; }
.release { display: grid; gap: 1.2rem 1rem; grid-template-columns: repeat(2, 1fr); margin-top: 1.4rem; }
@media (min-width: 700px) { .release { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1040px) { .release { grid-template-columns: repeat(4, 1fr); } }
.release .foto button, .release .foto button:hover { transform: none; padding: 6px; }
.release .foto button:hover { box-shadow: 0 0 0 3px var(--cor), 0 10px 24px rgba(31, 42, 107, .22); }
.release .foto img { aspect-ratio: auto; object-fit: contain; }
.release figcaption { text-align: center; font-weight: 700; }
body.com-fundo .bloco__dica { color: var(--t-tinta); text-shadow: var(--t-halo); }

/* Mural: polaroides em colunas (alvenaria), cada foto na proporção original. */
.mural { columns: 2; column-gap: 1rem; margin-top: 1.6rem; }
@media (min-width: 700px) { .mural { columns: 3; } }
@media (min-width: 1040px) { .mural { columns: 4; } }
.mural .foto { break-inside: avoid; margin-bottom: 1.4rem; }
.mural .foto img { aspect-ratio: auto; object-fit: contain; }
.vazio {
  display: grid; place-items: center; text-align: center; min-height: 170px; padding: 2rem; margin-top: 1.6rem;
  border-radius: var(--raio); border: 3px dashed var(--cor); color: var(--texto-2); font-weight: 600;
}
.ed-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 3.5rem; }
.ed-nav a { text-decoration: none; padding: 1.1rem 1.25rem; border-radius: var(--raio); color: var(--t, #fff); background: var(--c); display: grid; gap: .1rem; border: 3px solid var(--anil); box-shadow: 5px 5px 0 var(--anil); }
.ed-nav a:last-child { text-align: right; }
.ed-nav small { font-weight: 700; font-size: .9rem; }
.ed-nav strong { font-family: var(--display); font-weight: 400; font-size: 1.6rem; }
/* Versão pequena no topo da página da edição, ao lado de "Todas as edições". */
.ed-topo__barra { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6rem 1rem; margin-bottom: 1.2rem; position: relative; z-index: 2; }
.ed-topo__barra .ed-topo__voltar { margin-bottom: 0; }
.ed-nav--mini { display: flex; gap: .5rem; margin-top: 0; }
.ed-nav--mini a { padding: .35rem .85rem; border-width: 2px; box-shadow: 3px 3px 0 var(--anil); font-family: var(--display); font-size: 1rem; line-height: 1.2; }

/* ---------- Rodapé ---------- */
.rodape { background: var(--anil); color: #d6daf5; padding: 3.2rem 0 2.6rem; }
.rodape .titulo { color: var(--sol); font-size: 2rem; margin-bottom: 1rem; }
.rodape__grade { display: grid; gap: 2rem; }
@media (min-width: 820px) { .rodape__grade { grid-template-columns: 2fr 1fr; } }
.parceiros { display: grid; gap: .8rem; margin: 0; }
.parceiros dt { font-weight: 800; font-stretch: 85%; color: var(--sol); font-size: .88rem; }
.parceiros dd { margin: 0; }
.parceiros__logo { display: block; width: auto; height: 72px; max-width: 100%; margin-top: .35rem; }
.rodape a { color: #fff; font-weight: 700; }

/* ---------- Janelas ---------- */
dialog { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; }
dialog::backdrop { background: rgba(21, 29, 77, .94); }
.janela { width: 100vw; height: 100dvh; display: grid; place-items: center; padding: 3.5rem 1rem 1.5rem; color: #fff; }
.janela__fechar {
  position: fixed; top: calc(.75rem + env(safe-area-inset-top, 0px)); right: .75rem; z-index: 2;
  width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--sol); color: var(--anil); font-size: 1.6rem; line-height: 1; font-weight: 800;
}
.lb__img { max-width: min(100%, 1400px); max-height: calc(100dvh - 9rem); object-fit: contain; border-radius: 8px; }
#lb.lb--doc { overflow-y: auto; overscroll-behavior: contain; }
.lb--doc .janela { height: auto; min-height: 100dvh; place-items: start center; }
.lb--doc figure { width: min(100%, 900px); }
.lb--doc .lb__img { width: 100%; max-height: none; }
.lb__legenda { text-align: center; margin: .75rem auto 0; max-width: 60ch; }
.lb__seta { position: fixed; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); font-size: 1.6rem; }
.lb__seta--ant { left: .75rem; } .lb__seta--prox { right: .75rem; }
@media (max-width: 640px) { .lb__seta { top: auto; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); transform: none; } }
.vd__quadro { width: min(100%, 1100px); aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
.vd__quadro iframe { width: 100%; height: 100%; border: 0; display: block; }
.vd__rodape { width: min(100%, 1100px); margin-top: .75rem; display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; justify-content: space-between; }
.vd__rodape a { color: var(--sol); font-weight: 700; }


/* ---------- Fundo com as paletas dos cartazes ----------
   Cada edição vira um degradê com as cores do seu cartaz (PALETAS, no JS), escurecidas para o texto
   branco e misturadas à base escura pela --fundo-opacidade. As paletas se alternam conforme a rolagem.
   Títulos e textos são brancos (--t-tinta), com halo escuro (--t-brilho); o texto corrido fica num .painel. */
.fundo-cartaz { display: none; position: fixed; inset: 0; z-index: -1; background: rgb(11, 16, 51); }
.fundo-cor { position: absolute; inset: 0; opacity: 0; }
/* Véu da cor da base: com --fundo-opacidade 0.9, a tela mostra 90% da cor e 10% da base escura. */
.fundo-cartaz::after { content: ""; position: absolute; inset: 0; background: rgb(11, 16, 51); opacity: calc(1 - var(--fundo-opacidade)); }
body.com-fundo {
  /* Modo noite: todo o texto em branco sobre o fundo escurecido; painéis viram vidro escuro. */
  --texto: #fff; --texto-2: #e3e6f7; --vidro: rgba(11, 16, 51, .62);
  --t-tinta: #fff; --t-brilho: #0a0e2d;
  --t-halo: 0 0 3px var(--t-brilho), 0 0 8px var(--t-brilho), 0 0 16px color-mix(in srgb, var(--t-brilho) 95%, transparent), 0 0 30px color-mix(in srgb, var(--t-brilho) 85%, transparent);
}
body.com-fundo :is(.abertura h1, .abertura__pre, .abertura__sub, .secao > .envelope > .titulo, .secao .intro:not(.chamada .intro), .sobre .titulo,
  .ed-topo__voltar, .ed-topo__edicao, .ed-topo h1, .bloco h2, .foto figcaption) {
  color: var(--t-tinta); transition: color .6s ease, text-shadow .6s ease;
}
/* Títulos todos em branco (sem as letras coloridas da versão clara do site). */
body.com-fundo .abertura h1 .rural .l { color: var(--t-tinta); }
body.com-fundo .fundo-cartaz { display: block; }
/* Faixa corrida translúcida: o fundo aparece por trás (já escurecido para o branco, então segue legível). */
body.com-fundo .faixa { background: rgba(31, 42, 107, .38); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-color: rgba(255, 92, 154, .75); }
body.com-fundo .faixa li { text-shadow: 0 0 6px #0a0e2d, 0 0 14px rgba(10, 14, 45, .8); }
/* A Rural em movimento: atravessa a tela no rodapé do fundo, vira fora da tela e volta (30 s por volta),
   sacolejando como carro em estrada de terra. Tamanho proporcional à tela: ~40% da largura. */
.fundo-rural { display: none; position: fixed; left: 0; bottom: 2vh; z-index: -1; width: clamp(220px, 40vw, 640px); pointer-events: none; animation: rural-viaja 30s linear infinite; }
.fundo-rural img { width: 100%; height: auto; display: block; }
/* Peças que reagem quando a Rural passa perto (--rural de 0 a 1 e --lado ±1, vindos do JS): pulam e se
   inclinam para longe dela (até 40 px para cima, 14 px para o lado, 10° e 8% maiores). Usa translate, rotate e scale, que somam com o transform próprio de cada peça
   (inclinação de polaroide, hover etc.) sem mexer nas transições dela. */
:is(.cartao, .carta, .polaroide, .foto > button, .leitor__folha, .leitor__mini, .parada a, .linguagem, .fatos div, .botao, .filtro, .ed-nav a) {
  translate: calc(var(--rural, 0) * var(--lado, 1) * 14px) calc(var(--rural, 0) * -40px);
  rotate: calc(var(--rural, 0) * var(--lado, 1) * 10deg);
  scale: calc(1 + var(--rural, 0) * .08);
}
/* As peças que se mexem não podem tapar o que está em volta:
   - os filtros (botões das edições no Mural e em Vídeos) ficam sempre por cima das fotos que crescem;
   - os cartões de "O que a Rural leva" ficam translúcidos enquanto se mexem, para o texto de cima aparecer. */
.filtros { position: relative; z-index: 6; }
.linguagem { opacity: calc(1 - var(--rural, 0) * .5); }
/* Polaroides no modo noite: moldura creme em vez de branco puro (que ofusca sobre o fundo escuro) e as
   fotos da abertura um pouco mais contidas nas luzes altas, porque algumas vieram estouradas. */
body.com-fundo :is(.polaroide, .foto button, .carta) { background: #efe8da; }
/* (as fotos da abertura da página inicial ficam no carrossel, com o mesmo ajuste de brilho em .carrossel__foto img) */
body.com-fundo .fundo-rural { display: block; }
/* O perna de pau de gorro de bobo (da 3ª edição): atravessa o fundo e volta (24 s por volta, defasado da Rural),
   sempre de frente para onde anda (o desenho olha para a direita; na ida para a esquerda, vira). O passo com
   joelhos é desenhado no canvas, em ligarPernaDePau() (no JS). */
.fundo-perna { display: none; position: fixed; left: 0; bottom: 1vh; z-index: -1; height: clamp(240px, 56vh, 600px); aspect-ratio: 806 / 1000; pointer-events: none; animation: perna-anda 24s linear -9s infinite; }
body.com-fundo .fundo-perna { display: block; }
.fundo-perna canvas { display: block; width: 100%; height: 100%; }
@keyframes perna-anda {
  0%   { transform: translateX(100vw) scaleX(-1); }
  48%  { transform: translateX(-100%) scaleX(-1); }
  50%  { transform: translateX(-100%) scaleX(1); }
  98%  { transform: translateX(100vw) scaleX(1); }
  100% { transform: translateX(100vw) scaleX(-1); }
}
.fundo-rural img, .estrada__rural img { transform-origin: 50% 90%; animation: rural-sacode .45s ease-in-out infinite alternate; }
@keyframes rural-viaja {
  0%   { transform: translateX(-100%) scaleX(1); }
  48%  { transform: translateX(100vw) scaleX(1); }
  50%  { transform: translateX(100vw) scaleX(-1); }
  98%  { transform: translateX(-100%) scaleX(-1); }
  100% { transform: translateX(-100%) scaleX(1); }
}
@keyframes rural-sacode {
  from { transform: translateY(0) rotate(-1.2deg); }
  to   { transform: translateY(-1.2%) rotate(1deg); }
}
body.com-fundo .abertura { background: transparent; }
body.com-fundo .secao { background: transparent; }

body.com-fundo .ed-texto.painel { max-width: calc(64ch + 2.8rem); }
body.com-fundo .vazio { background: var(--vidro); color: #fff; }
/* Modo noite, demais peças: texto branco sobre vidro escuro ou sobre o azul-noite dos cartões. As peças
   pintadas na cor de uma edição (números, linguagens, filtro ativo) mantêm a tinta calculada para
   contraste (branco ou anil), porque branco não se lê sobre amarelo ou rosa. */
body.com-fundo .chamada .titulo { color: var(--sol); }

body.com-fundo .pendente { background: var(--vidro); border-color: var(--sol); color: #fff; }

body.com-fundo .cartao { background: var(--noite); border-color: #fff; color: #fff; }

/* Cartões de vídeo translúcidos: o fundo colorido aparece atrás do texto (já escuro, então o branco segue legível). */
body.com-fundo .cartao[data-video] { background: rgba(21, 29, 77, .4); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
body.com-fundo .cartao[data-video] .cartao__info { text-shadow: 0 0 6px #0a0e2d, 0 0 12px rgba(10, 14, 45, .7); }
body.com-fundo .filtro { background: var(--vidro); border-color: #fff; color: #fff; }

  const luz = hex => hex.match(/\w\w/g).map(h => parseInt(h, 16) / 255)

  const legendaMural = f => f.edicao && ed(f.edicao) ? legendaFoto(ed(f.edicao), f) : (f.legenda || "Foto da mostra Vai de Rural");
  const rotuloEd = e => `${e.n}ª edição`;
  const ICONE_FALA = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  const botaoOuvir = (rotulo, extra = "") => `<button class="ouvir ${extra}" data-ouvir aria-pressed="false">${ICONE_FALA}<span>${esc(rotulo)}</span></button>`;
  const cartazEd = e => ({ id: e.cartaz, legenda: `Cartaz da ${rotuloEd(e)}` });
  const releaseEd = e => (e.release || []).map((id, k) => ({ id, legenda: `Release da ${rotuloEd(e)}, página ${k + 1}` }));

  /* ---------- Vídeos ---------- */
  const thumbYT = id => `https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`;
  const tituloVideo = v => v.titulo || `Vídeo ${VIDS.indexOf(v) + 1}`;
  const cartaoVideo = v => {
    const e = v.edicao ? ed(v.edicao) : null;
    return `<button class="cartao" data-video="${VIDS.indexOf(v)}" style="${e ? `--vc:${e.cor}` : "--vc:var(--sol)"}">
      <span class="cartao__capa">
        <img src="${thumbYT(v.id)}" alt="" loading="lazy" decoding="async">
        <span class="cartao__play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>
      </span>
      <span class="cartao__info">
        <span class="cartao__titulo">${esc(tituloVideo(v))}</span>
        ${e ? `<span class="cartao__etiqueta">${rotuloEd(e)}</span>` : ""}
      </span>

  };

  /* Títulos pelo oEmbed do YouTube (com um serviço público de reserva).
     Se o título trouxer "Nª edição", o vídeo entra na página da edição.
     Se tudo falhar, os cartões seguem como "Vídeo N". */
  async function carregarTitulos() {
    const pega = async url => {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 6000);
      try {
        const r = await fetch(url, { signal: ctrl.signal });
        if (!r.ok) return null;
        const j = await r.json();
        return j && typeof j.title === "string" ? j.title : null;
      } catch { return null; } finally { clearTimeout(t); }
    };
    let mudou = false;
    await Promise.all(VIDS.map(async v => {
      const watch = encodeURIComponent(`https://www.youtube.com/watch?v=${v.id}`);
      const titulo = await pega(`https://www.youtube.com/oembed?url=${watch}&format=json`)
                  ?? await pega(`https://noembed.com/embed?url=${watch}`);
      if (!titulo) return;
      v.titulo = titulo; mudou = true;
      if (v.edicao == null) {
        const m = titulo.match(/\b([1-7])\s*[ªºa°]\s*edi[çc][ãa]o/i);
        if (m) v.edicao = Number(m[1]);
      }
    }));
    if (mudou) render(false, false);
  }

  /* ---------- Blocos ---------- */
  const letras = (txt, i0) => [...txt].map((c, k) => `<span class="l" style="--i:${i0 + k}">${c === " " ? "&nbsp;" : esc(c)}</span>`).join("");

  function estrada() {
    return `<section class="estrada-sec" aria-labelledby="t-estrada">
      <div class="envelope">
        <h2 class="titulo" id="t-estrada">A estrada da Rural</h2>
        <p class="intro">Cada parada é uma edição. Toque numa delas para ver onde a mostra passou, as fotos e os vídeos.</p>
        <div class="estrada" data-estrada>
          <div class="estrada__trilho">
            <div class="estrada__asfalto"></div>
            <div class="estrada__rural" data-rural></div>
            <ol class="estrada__paradas">
              ${EDS.map(e => `<li class="parada">
                <a href="#/edicao/${e.n}" style="--c:${e.cor};--t:${e.tinta}" data-parada>
                  <span class="parada__num">${e.n}ª</span>
                  <span class="parada__local">${esc(e.titulo)}</span>
                  <span class="parada__ano">${esc(e.ano)}</span>
                </a></li>`).join("")}
            </ol>
          </div>
        </div>
        <p class="estrada__dica">Arraste para o lado para ver todas as edições.</p>
      </div>
    </section>`;
  }

  function ligarEstrada() {
    const box = $("[data-estrada]");
    if (!box) return;
    const rural = $("[data-rural]", box);
    rural.innerHTML = `<img src="assets/rural-3a.webp" alt="A Rural" width="581" height="411">`;
    const paradas = $$("[data-parada]", box), inicial = paradas[paradas.length - 1];
    const xDe = a => {
      const t = $(".estrada__trilho", box).getBoundingClientRect(), r = a.getBoundingClientRect();
      return Math.round(r.left - t.left + r.width / 2 - rural.offsetWidth / 2);
    };
    const moverPara = a => { rural.style.transform = `translateX(${xDe(a)}px)`; };
    /* Tela de toque (sem mouse): a Rural vai sozinha da 1ª à última parada e volta, em loop de 18 s.
       Na volta o desenho vira (scaleX -1) para andar de frente. Para quando a página troca. */
    if (matchMedia("(hover: none)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      let x0 = 0, x1 = 0, t0 = null;
      const limites = () => { x0 = xDe(paradas[0]); x1 = xDe(inicial); };
      const suave = p => p < .5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2;
      const DUR = 18000;
      rural.style.transition = "none";
      limites();
      box._reposicionar = limites;
      const quadro = agora => {
        if (!box.isConnected) return;
        t0 ??= agora;
        const f = ((agora - t0) % DUR) / DUR;
        let x, s;
        if (f < .47)      { x = x0 + (x1 - x0) * suave(f / .47); s = 1; }
        else if (f < .5)  { x = x1; s = 1 - 2 * (f - .47) / .03; }
        else if (f < .97) { x = x1 - (x1 - x0) * suave((f - .5) / .47); s = -1; }
        else              { x = x0; s = -1 + 2 * (f - .97) / .03; }
        rural.style.transform = `translateX(${x.toFixed(1)}px) scaleX(${s.toFixed(3)})`;
        requestAnimationFrame(quadro);
      };
      requestAnimationFrame(quadro);
      return;
    }
    // Posição inicial sem animação; o movimento fica só para a interação.
    rural.style.transition = "none";
    moverPara(inicial);
    rural.getBoundingClientRect();
    rural.style.transition = "";
    paradas.forEach(a => ["mouseenter", "focus"].forEach(ev => a.addEventListener(ev, () => moverPara(a))));
    box._reposicionar = () => moverPara(inicial);
  }

  // Resumo da página inicial, com botão grande de ouvir (para quem não lê ou prefere escutar).
  function blocoResumo() {

  // h1 de duas linhas, com a segunda colorida letra a letra (mesmo recurso da home, sem animação).
  function tituloPagina(id, linha1, linha2) {

    return `<h1 id="${id}" aria-label="${esc(rotulo)}"><span aria-hidden="true">${linha1 ? `${esc(linha1)}<br>` : ""}<span class="rural">${letras(linha2, 0)}</span></span></h1>`;

  function chamada(titulo, texto, href, rotulo) {
    return `<section class="secao chamada" aria-label="${esc(titulo)}">
      <div class="envelope chamada__grade">

  /* Carrossel das aberturas (página inicial e Mural): as fotos giram numa roda; a da frente fica grande
     e nítida, as de trás menores e apagadas. Cada foto leva à sua edição. itens: [{ id, e }] ou
     [{ id, href, rotulo }] para levar a outro lugar (Tripulantes); sem itens,
     usa as fotos da colagem e a primeira de cada edição. As posições são calculadas em ligarCarrossel(). */
  function carrossel(lista) {
    const vistas = new Set();
    const itens = (lista || [...P.colagem.map(id => ({ id, e: EDS.find(e => e.fotos.some(f => f.id === id)) })),
                             ...EDS.filter(e => e.fotos[0]).map(e => ({ id: e.fotos[0].id, e }))])
      .filter(it => !vistas.has(it.id) && vistas.add(it.id));
    return `<div class="carrossel" data-carrossel aria-label="Fotos das edições">
      ${itens.map((it, k) => `<a class="carrossel__foto" href="${it.href || (it.e ? `#/edicao/${it.e.n}` : "#/edicoes")}"
          aria-label="${esc(it.rotulo || (it.e ? `Foto da ${rotuloEd(it.e)}` : "Foto da mostra"))}">
        ${imgFoto(it.id, 700, "", k === 0 ? 'fetchpriority="high" loading="eager"' : 'loading="eager"')}
        ${it.e ? `<span class="carrossel__ed" style="--c:${it.e.cor};--t:${it.e.tinta}">${it.e.n}ª</span>` : ""}
      </a>`).join("")}
    </div>`;
  }
  function ligarCarrossel() {
    const roda = $("[data-carrossel]");
    if (!roda) return;
    const fotos = $$(".carrossel__foto", roda), n = fotos.length;
    const parado = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let giro = 0, ultimo = null, pausa = false;
    roda.addEventListener("mouseenter", () => { pausa = true; });
    roda.addEventListener("mouseleave", () => { pausa = false; });
    roda.addEventListener("focusin", () => { pausa = true; });
    roda.addEventListener("focusout", () => { pausa = false; });
    const posicionar = () => {
      const largura = roda.clientWidth;
      fotos.forEach((f, i) => {
        const a = (i / n) * Math.PI * 2 + giro;
        const frente = (Math.cos(a) + 1) / 2;                 // 1 = bem na frente, 0 = bem atrás
        f.style.setProperty("--cx", `${(Math.sin(a) * largura * .34).toFixed(1)}px`);
        f.style.setProperty("--cy", `${((1 - frente) * -26).toFixed(1)}px`);
        f.style.setProperty("--cs", (.45 + frente * .62).toFixed(3));
        f.style.setProperty("--cr", `${(Math.sin(a) * -8).toFixed(1)}deg`);
        f.style.zIndex = String(Math.round(frente * 100));
        f.style.opacity = (.35 + frente * .65).toFixed(3);
        f.style.filter = `brightness(${(.55 + frente * .45).toFixed(3)})`;
        f.tabIndex = frente > .8 ? 0 : -1;
      });
    };
    const quadro = agora => {
      if (!roda.isConnected) return;
      if (ultimo != null && !pausa) giro -= (agora - ultimo) / 1000 * (Math.PI * 2 / (n * 3.2));   // ~3,2 s por foto
      ultimo = agora;
      posicionar();
      requestAnimationFrame(quadro);
    };
    if (parado) return posicionar();
    requestAnimationFrame(quadro);
  }

  /* Baralho da página Edições: uma carta por edição, espalhadas na mesa. A foto é a primeira da
     edição (ou o cartaz); o número aparece grande no canto de cima. As posições são aplicadas em ligarBaralho(). */
  function baralho() {
    return `<div class="baralho-mesa">
      <div class="baralho" data-baralho>
        ${EDS.map(e => {
          const capa = e.fotos[0] ? e.fotos[0].id : e.cartaz;
          return `<a class="carta" href="#/edicao/${e.n}" style="--c:${e.cor};--t:${e.tinta}"
              aria-label="${esc(`${rotuloEd(e)}${e.ano ? `, ${e.ano}` : ""}: ${e.titulo}`)}">
            <span class="carta__foto">${capa ? imgFoto(capa, 600, "") : ""}</span>
            <span class="carta__num" aria-hidden="true">${e.n}ª</span>
            ${e.ano ? `<span class="carta__ano" aria-hidden="true">${esc(e.ano)}</span>` : ""}
          </a>`;
        }).join("")}
      </div>
      <button class="botao botao--branco baralho__embaralhar" data-embaralhar>Embaralhar</button>
    </div>`;
  }

  /* Lugares na mesa (em %: a carta ocupa 40% da largura, então x vai até 60 e y até ~33), na ordem
     de empilhamento: quatro atrás, três na frente e mais abaixo. Cada carta cobre só a direita e a
     parte de baixo das anteriores, então o número (no canto de cima, à esquerda) fica sempre à vista. */
  const MESA = [
    { x: 0, y: 3, r: -10 }, { x: 19, y: 0, r: -4 }, { x: 40, y: 4, r: 5 }, { x: 60, y: 1, r: 12 },
    { x: 7, y: 31, r: -7 }, { x: 30, y: 33, r: 3 }, { x: 53, y: 30, r: 9 }
  ];
  let baralhoAnimado = false;
  /* Põe cada carta num lugar da mesa. distribuir: as cartas saem do monte, uma de cada vez.
     aleatorio: embaralha (troca as edições de lugar e varia um pouco posição e inclinação). */
  function espalharCartas(caixa, { distribuir = false, aleatorio = false } = {}) {
    const cartas = $$(".carta", caixa);
    const lugares = MESA.map((_, i) => i);
    if (aleatorio) for (let i = lugares.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [lugares[i], lugares[j]] = [lugares[j], lugares[i]]; }
    const variar = v => aleatorio ? v + (Math.random() - 0.5) * 6 : v;
    cartas.forEach((c, i) => {
      const k = lugares[i % lugares.length], p = MESA[k];
      if (distribuir) c.style.setProperty("--atraso", `${k * 90}ms`);
      c.style.setProperty("--x", `${Math.min(60, Math.max(0, variar(p.x)))}%`);
      c.style.setProperty("--y", `${Math.min(33, Math.max(0, variar(p.y)))}%`);
      c.style.setProperty("--r", `${aleatorio ? p.r + (Math.random() - 0.5) * 10 : p.r}deg`);
      c.style.setProperty("--z", k + 1);
    });
  }
  function ligarBaralho() {
    const caixa = $("[data-baralho]");
    if (!caixa) { baralhoAnimado = false; return; }
    // A distribuição só acontece ao chegar na página (não quando os títulos dos vídeos re-renderizam).
    if (baralhoAnimado || matchMedia("(prefers-reduced-motion: reduce)").matches) return espalharCartas(caixa);
    baralhoAnimado = true;
    $$(".carta", caixa).forEach(c => { c.style.setProperty("--x", "30%"); c.style.setProperty("--y", "16%"); c.style.setProperty("--r", "0deg"); });
    caixa.getBoundingClientRect();
    requestAnimationFrame(() => espalharCartas(caixa, { distribuir: true }));
    // Depois da distribuição, tira o atraso para o passar do mouse responder na hora.
    setTimeout(() => $$(".carta", caixa).forEach(c => c.style.setProperty("--atraso", "0ms")), 1600);
  }

  function faixa() {
    const itens = P.faixa.map(t => `<li>${esc(t)}</li>`).join("");
    // A lista é duplicada para o loop não ter emenda; a cópia fica oculta para leitores de tela.
    return `<div class="faixa"><div class="faixa__trilha"><ul>${itens}</ul><ul aria-hidden="true">${itens}</ul></div></div>`;
  }

  // Fotos do mural com o filtro aplicado (n = número da edição, ou null para todas).
  // data-foto guarda a posição em MURAL, para a ampliação seguir a mesma lista filtrada.
  let muralFiltro = null;
  const muralVisivel = () => MURAL.filter(f => muralFiltro == null || f.edicao === muralFiltro);
  function fotosMural(n) {
    muralFiltro = n;
    return muralVisivel().map((f, k) => `
      <figure class="foto">
        <button data-foto-mural="${k}" aria-label="Ampliar: ${esc(legendaMural(f))}">${imgFoto(f.id, 800, legendaMural(f))}</button>
        ${f.legenda ? `<figcaption>${esc(f.legenda)}</figcaption>` : ""}
      </figure>`).join("");
  }

  /* ---------- Páginas ---------- */
  const paginas = {
    inicio() {
      return `
      <section class="abertura">
        <div class="envelope abertura__grade">
          <div>
            <p class="abertura__pre">${esc(P.subtitulo)}, ${EDS.length} edições</p>
            <h1 aria-label="Vai de Rural" data-titulo><span aria-hidden="true">${letras("Vai de", 0)}<br><span class="rural">${letras("Rural", 6)}</span></span></h1>
            <p class="abertura__sub">${esc(P.chamada)}</p>
            <div class="botoes" style="margin-top:1.6rem">
              <a class="botao" href="#/edicoes">Ver as ${EDS.length} edições</a>
              <a class="botao botao--branco" href="#/videos">Assistir aos vídeos</a>
            </div>
          </div>
          ${carrossel()}
        </div>
      </section>
      ${faixa()}
      ${blocoResumo()}
      ${estrada()}
      ${blocoLinguagens()}
      ${blocoSobre()}
      <section class="secao secao--rosa" aria-labelledby="t-videos">
        <div class="envelope">
          <h2 class="titulo" id="t-videos">Vídeos</h2>
          <p class="intro">Toque para assistir aqui mesmo.</p>
          <div class="cartoes">${VIDS.slice(0, 6).map(cartaoVideo).join("")}</div>
          <p style="margin-top:2rem"><a class="botao" href="#/videos">Ver todos os ${VIDS.length} vídeos</a></p>
        </div>
      </section>`;
    },

    edicoes() {
      return `
      <section class="abertura abertura--pagina">
        <div class="envelope abertura__grade">
          <div>
            <p class="abertura__pre">${esc(P.subtitulo)}</p>
            ${tituloPagina("t-lista", `As ${EDS.length}`, "edições")}
            <p class="abertura__sub">Da primeira viagem pela Bacia do Paramirim até a Comunidade Quilombola do Baixão, em Vitória da Conquista.</p>
          </div>
          ${baralho()}
        </div>
      </section>
      ${faixa()}
      <section class="secao" aria-labelledby="t-cartoes">
        <div class="envelope">
          <h2 class="sr" id="t-cartoes">Lista de edições</h2>
          <div class="cartoes" style="margin-top:0">
            ${EDS.map(e => {
              // Capa: primeira foto; sem foto, o cartaz; sem nenhum dos dois, o número na cor da edição.
              const capa = e.fotos[0] ? e.fotos[0].id : e.cartaz;
              return `<a class="cartao" href="#/edicao/${e.n}" style="--vc:${e.cor};--t:${e.tinta}">
                <span class="cartao__capa">${capa ? imgFoto(capa, 640, "", capa === e.cartaz ? 'class="cartao__cartaz"' : "") : `<span class="cartao__num">${e.n}ª</span>`}</span>
                <span class="cartao__info">
                  <span class="cartao__etiqueta">${rotuloEd(e)}${e.ano ? `, ${e.ano}` : ""}</span>
                  <span class="cartao__titulo">${esc(e.titulo)}</span>
                </span>
              </a>`;
            }).join("")}
          </div>
        </div>
      </section>
      ${estrada()}
      ${chamada("A Rural em movimento", "Os registros em vídeo de cada parada da mostra.", "#/videos", "Assistir aos vídeos")}`;
    },

    edicao(n) {
      const e = ed(n);
      if (!e) return paginas.naoEncontrada();
      const i = EDS.indexOf(e), ant = EDS[i - 1], prox = EDS[i + 1];
      const vids = VIDS.filter(v => v.edicao === n);
      const raiz = document.documentElement.style;
      raiz.setProperty("--cor", e.cor); raiz.setProperty("--tinta", e.tinta);
      return `
      <section class="ed-topo">
        <span class="ed-topo__num" aria-hidden="true">${e.n}</span>
        <div class="envelope">
          <div class="ed-topo__barra">
            <a class="ed-topo__voltar" href="#/edicoes">‹ Todas as edições</a>
            <nav class="ed-nav ed-nav--mini" aria-label="Edição anterior e próxima">
              ${ant ? `<a href="#/edicao/${ant.n}" style="--c:${ant.cor};--t:${ant.tinta}" aria-label="Edição anterior: ${ant.n}ª">‹ ${ant.n}ª</a>` : ""}
              ${prox ? `<a href="#/edicao/${prox.n}" style="--c:${prox.cor};--t:${prox.tinta}" aria-label="Próxima edição: ${prox.n}ª">${prox.n}ª ›</a>` : ""}
            </nav>
          </div>
          <p class="ed-topo__edicao">${rotuloEd(e)}${e.ano ? `, ${e.ano}` : ""}</p>
          <h1>${esc(e.titulo)}</h1>
          ${e.ficha.length ? `<ul class="ficha">${e.ficha.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}
        </div>

      return `
      <section class="abertura abertura--pagina">
        <div class="envelope abertura__grade">

            <p class="abertura__sub">Quem pega a estrada com a Rural: produção, técnica, artistas e parceiros do movimento.</p>
          </div>
          ${ARTISTAS.length ? carrossel(artistasCarrossel()) : `<div class="colagem" aria-hidden="true">
            ${amostra.map(([c, t]) => `<div class="polaroide"><div class="polaroide__arte" style="--c:${c};--t:${t}">${pessoa}</div></div>`).join("")}

          <div class="artistas">${ARTISTAS.map((a, k) => `
            <article class="artista">
              <div class="artista__fotos">
                <button class="artista__destaque" data-artista="${k}" data-artista-foto="0" aria-label="Ampliar a foto${a.nome ? ` de ${esc(a.nome)}` : ""}">${imgFoto(a.fotos[0], 800, a.nome || "Artista da Rural")}</button>
                ${a.fotos.length > 1 ? `<div class="artista__mini">${a.fotos.slice(1).map((id, i) => `<button data-artista="${k}" data-artista-foto="${i + 1}" aria-label="Ampliar a foto ${i + 2}">${imgFoto(id, 800, "")}</button>`).join("")}</div>` : ""}

              ${equipe.length ? `<h4 class="trip-ed__grupo">Equipe</h4><div class="cartoes trip-ed__cartoes">${equipe.map(([p, f]) => cartaoTrip(p, f, e)).join("")}</div>` : ""}

          ${porEdicao.length && porEdicao.length < EDS.length ? `<p class="bloco__dica">A equipe da ${EDS.filter(e => !porEdicao.some(g => g.e === e)).map(rotuloEd).join(", ").replace(/, ([^,]*)$/, " e $1")} ainda vai ser adicionada.</p>` : ""}

    naoEncontrada() {

  };


  /* ---------- Fundo com as paletas dos cartazes ----------
     A posição de rolagem (0 a 1) vira um índice de 0 a (paletas da página - 1); cada paleta fica
     visível perto do seu índice e some linearmente, então duas paletas se misturam entre uma e outra. */
  const camada = $("[data-fundo-cartaz]");
  /* Cada página mistura as paletas à sua maneira: abre com uma diferente e mostra uma sequência
     própria. Páginas curtas usam 4 paletas (com 6, a troca ficaria rápida demais). Para mudar, edite ORDEM. */
  const CARTAZES = ["1", "2", "3", "4", "5", "6", "7"];
  const ORDEM = {
    inicio:  ["3", "5", "2", "4", "6", "7"],
    edicoes: ["7", "4", "6", "3"],
    videos:  ["6", "2", "3", "7"],
    mural:   ["5", "7", "2", "4"],
    tripulantes: ["2", "6", "4", "7"],
    releases: ["6", "5", "4", "3"],
    sobre:   ["4", "5", "2", "6"]
  };
  /* Página de uma edição: abre com a paleta dela e segue com outras três. A 1ª, fora de CARTAZES,
     usa a sequência da página Edições. */
  function ordemEdicao(n) {
    const proprio = String(n);
    if (!CARTAZES.includes(proprio)) return ORDEM.edicoes;
    return [proprio, ...["7", "4", "6", "3", "2", "5"].filter(c => c !== proprio)].slice(0, 4);
  }
  let ordem = ORDEM.inicio;

  const hexRgb = h => h.match(/\w\w/g).map(x => parseInt(x, 16));
  const rgbHex = c => "#" + c.map(v => Math.round(Math.min(255, Math.max(0, v))).toString(16).padStart(2, "0")).join("");
  const contraste = (x, y) => { const [a, b] = [luz(x), luz(y)].sort((m, n) => n - m); return (a + 0.05) / (b + 0.05); };
  const hsl = ([r, g, b]) => {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
    if (!d) return [0, 0, l];
    const s = d / (1 - Math.abs(2 * l - 1));
    const h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h * 60, s, l];
  };
  const rgbDeHsl = (h, s, l) => {
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return [r + m, g + m, b + m].map(v => v * 255);
  };
  /* Fundo escuro para o texto branco: cada cor da paleta é escurecida (mesmo tom e saturação, menos luz)
     até o branco passar de 6:1 sobre ela, já contando a mistura com a base escura da camada
     (.fundo-cartaz, cor FUNDO_BASE) pela --fundo-opacidade. Assim o texto é legível em qualquer ponto. */
  const FUNDO_BASE = [11, 16, 51];
  const alfaFundo = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fundo-opacidade")) || 1;
  const naTela = h => rgbHex(hexRgb(h).map((v, i) => v * alfaFundo() + FUNDO_BASE[i] * (1 - alfaFundo())));
  function escurecer(h) {
    const [hh, s, l0] = hsl(hexRgb(h));
    for (let l = l0; l > 0.04; l -= 0.01) {
      const cor = rgbHex(rgbDeHsl(hh, s, l));
      if (contraste("#ffffff", naTela(cor)) >= 6) return cor;
    }
    return rgbHex(rgbDeHsl(hh, s, 0.08));
  }
  const PALETAS_ESCURAS = Object.fromEntries(Object.entries(PALETAS).map(([k, p]) => [k, p.map(escurecer)]));

  // Degradê de manchas: cada cor da paleta nasce num canto e se funde com as vizinhas.
  const degrade = ([a, b, c, d]) => [
    `radial-gradient(ellipse 75% 65% at 10% 12%, ${a} 0%, transparent 70%)`,
    `radial-gradient(ellipse 70% 60% at 92% 20%, ${b} 0%, transparent 70%)`,
    `radial-gradient(ellipse 80% 70% at 85% 92%, ${c} 0%, transparent 70%)`,
    `radial-gradient(ellipse 70% 65% at 8% 88%, ${d} 0%, transparent 70%)`,

  /* ---------- Leitura em voz alta ----------

  /* ---------- Perna de pau andando ----------
     O boneco é desenhado num canvas, no espaço de 806 x 1000 da figura. Cada perna é uma "tira" reta (a perna do
     desenho desentortada ao longo do seu eixo, em assets/perna-3a-*-tira.webp) desenhada em fatias finas ao longo
     de uma linha que sai do quadril e se curva no joelho: a dobra se espalha suavemente em volta do joelho, sem
     emendas. O joelho fica onde seria o de uma pessoa do tamanho do boneco (coxa ~ 24,5% da altura dele).
     Ciclo de 2,8 s por perna: apoio (esticada, vai da frente para trás) e balanço (volta dobrando o joelho);
     as duas pernas em fases opostas. O corpo desce um pouco quando as pernas se cruzam, e o braço de trás
     (assets/perna-3a-braco.webp) balança no ombro acompanhando o passo. */
  function ligarPernaDePau() {
    const tela = $(".fundo-perna canvas");
    if (!tela) return;
    const ctx = tela.getContext("2d");
    const carregar = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
    const QUADRIL = [197.9, 326.3], PIVO_BRACO = [157.8, 214.3], OMBRO = [156, 203], COXA = 162, SUAVE = 48, BACIA = 34, FATIA = 2;
    const FRENTE = 35.5, TRAS = 102.9, DOBRA = 55;            // ângulos (graus abaixo da horizontal) e dobra máxima
    const PERNAS = { frente: { src: "assets/perna-3a-frente-tira.webp", pad: 29 }, tras: { src: "assets/perna-3a-tras-tira.webp", pad: 29 } };
    const rad = g => g * Math.PI / 180, suave = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
    const vaiVem = x => (1 - Math.cos(Math.PI * x)) / 2;      // 0 → 1 com aceleração suave
    Promise.all([carregar("assets/perna-3a-corpo.webp"), carregar(PERNAS.frente.src), carregar(PERNAS.tras.src), carregar("assets/perna-3a-braco.webp")]).then(([corpo, tf, tt, braco]) => {
      PERNAS.frente.tex = tf; PERNAS.tras.tex = tt;
      // Ângulo da coxa e dobra do joelho numa fase f (0..1) do ciclo de uma perna.
      const pose = f => f < .5
        ? { coxa: FRENTE + (TRAS - FRENTE) * vaiVem(f / .5), joelho: 0 }                          // apoio
        : { coxa: TRAS - (TRAS - FRENTE) * vaiVem((f - .5) / .5), joelho: DOBRA * Math.sin(Math.PI * (f - .5) / .5) }; // balanço
      /* Desenha uma perna em fatias. A bacia dobra como o joelho, mas num trecho curto, logo na cintura: no topo
         (sob o colete) a perna fica no ângulo original do desenho (base) e em ~34 px chega ao ângulo da coxa no passo
         (num trecho longo a coxa fazia um "S", parecendo um joelho dobrado para trás). Mais abaixo, a dobra do
         joelho se soma do mesmo jeito. Como o topo nunca se mexe, a junta com o corpo não abre. */
      function perna(p, quadrilY, base, { coxa, joelho }) {
        const tex = p.tex, larg = tex.width;
        let a = rad(base), x = QUADRIL[0] - Math.cos(a) * p.pad, y = quadrilY - Math.sin(a) * p.pad;
        for (let r = 0; r < tex.height; r += FATIA) {
          const t = r - p.pad;
          a = rad(base + (coxa - base) * suave((t + 28) / BACIA) + joelho * suave((t - (COXA - SUAVE)) / (2 * SUAVE)));
          const c = Math.cos(a), s = Math.sin(a);
          ctx.setTransform(-s, c, c, s, x, y);                 // colunas da tira na normal, linhas ao longo da perna
          // fatia mais alta que o passo: na parte de fora das curvas as fatias se abrem, e a sobra cobre as frestas
          ctx.drawImage(tex, 0, r, larg, FATIA + 4, -larg / 2, 0, larg, FATIA + 4);
          x += c * FATIA; y += s * FATIA;
        }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }
      function desenhar(tempo) {
        const f = (tempo / 2800) % 1;
        const desce = 25 * (1 - Math.cos(4 * Math.PI * f)) / 2; // mais baixo quando as pernas se cruzam
        ctx.clearRect(0, 0, tela.width, tela.height);
        perna(PERNAS.tras, QUADRIL[1] + desce, TRAS, pose((f + .5) % 1));
        perna(PERNAS.frente, QUADRIL[1] + desce, FRENTE, pose(f));
        // Braço de trás: o topo do braço (arredondado, PIVO_BRACO na imagem) encaixa sob a manga, no ombro (OMBRO), e
        // gira ali balançando com o passo, um pouco para trás (a mão não encosta no quadril) sem soltar do ombro.
        const giro = rad(7 + 10 * Math.cos(2 * Math.PI * f));
        ctx.translate(OMBRO[0], OMBRO[1] + desce); ctx.rotate(giro); ctx.translate(-PIVO_BRACO[0], -PIVO_BRACO[1]);
        ctx.drawImage(braco, 0, 0, 806, 1000);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(corpo, 0, desce, 806, 1000);
      }
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return desenhar(0);
      const quadro = agora => {
        requestAnimationFrame(quadro);
        if (document.hidden || !document.body.classList.contains("com-fundo")) return;

      };

    });

  /* ---------- Peças que reagem à Rural ----------
     A cada quadro, mede a distância entre o centro da Rural do fundo e cada peça interativa visível.
     Perto (menos de metade da largura da Rural), a peça recebe --rural de 0 a 1 (com suavização, para ir e
     voltar sem tranco) e --lado (+1 se está à direita da Rural, -1 à esquerda), que o CSS transforma em
     pulo e inclinação. Vale ao rolar a página e com a Rural andando, no celular e no computador. */
  const PECAS_REAGEM = ".cartao, .carta, .polaroide, .foto > button, .leitor__folha, .leitor__mini, .parada a, .linguagem, .fatos div, .botao, .filtro, .ed-nav a";
  function ligarReacaoRural() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      requestAnimationFrame(quadro);

      if (quadros++ % 30 === 0) pecas = $$(PECAS_REAGEM, main);   // pega peças novas (filtros, troca de página)
      const r = rural.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * .55;
      const alcance = r.width * .55;

        if (novo < .003 && alvo === 0) { if (atual) { el.style.removeProperty("--rural"); el.style.removeProperty("--lado"); el._rural = 0; el._lado = undefined; } continue; }
        el._rural = novo; el._lado = lado;
        el.style.setProperty("--rural", novo.toFixed(3));
        el.style.setProperty("--lado", lado.toFixed(3));
      }
    };
    requestAnimationFrame(quadro);
  }

  // documento: páginas de release abrem na largura de leitura e rolam, em vez de caber inteiras na tela.
  function abrirFoto(lista, k, documento = false) {
    lb.classList.toggle("lb--doc", documento);
    lbLista = lista; lbIdx = k; mostrarFoto(); lb.showModal();
  }
  function passo(d) { const t = lbLista.length; if (t < 2) return; lbIdx = (lbIdx + d + t) % t; mostrarFoto(); }
  lb.addEventListener("click", ev => {
    const s = ev.target.closest("[data-lb]");
    if (s) return passo(Number(s.dataset.lb));
    if (ev.target.closest("[data-fechar]") || ev.target.classList.contains("janela")) lb.close();
  });
  lb.addEventListener("keydown", ev => {
    if (ev.key === "ArrowRight") passo(1);
    if (ev.key === "ArrowLeft") passo(-1);
  });
  let x0 = null;
  lb.addEventListener("touchstart", ev => { x0 = ev.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", ev => {
    if (x0 == null) return;
    const dx = ev.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) passo(dx < 0 ? 1 : -1);
  });

  /* ---------- Janela de vídeo ----------
     youtube-nocookie: sem cookies de rastreamento antes do play.
     O iframe é removido ao fechar, senão o áudio continua tocando. */
  const vd = $("#vd"), vdQuadro = $(".vd__quadro", vd);
  function abrirVideo(v) {
    vdQuadro.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?autoplay=1&rel=0"
      title="${esc(tituloVideo(v))}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    $(".vd__titulo", vd).textContent = tituloVideo(v);
    $(".vd__link", vd).href = `https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}`;
    vd.showModal();
  }
  vd.addEventListener("close", () => { vdQuadro.innerHTML = ""; });
  vd.addEventListener("click", ev => {
    if (ev.target.closest("[data-fechar]") || ev.target.classList.contains("janela")) vd.close();
  });

  /* ---------- Elementos fixos ---------- */
  (function bandeirinhas() {
    const svg = $("[data-bandeirinhas]"), cores = EDS.map(e => e.cor), w = 1200 / 40;
    let d = "";
    for (let k = 0; k < 40; k++) d += `<path d="M${k * w} 0h${w - 3}l-${(w - 3) / 2} 20z" fill="${cores[k % cores.length]}"/>`;
    svg.innerHTML = `<rect width="1200" height="2" fill="#151d4d"/>${d}`;
  })();
  $("[data-parceiros]").innerHTML = P.parceiros.map(([t, n, logo]) =>
    `<div><dt>${esc(t)}</dt><dd>${logo ? `<img class="parceiros__logo" src="${esc(logo)}" alt="${esc(n)}" loading="lazy">` : esc(n)}</dd></div>`).join("");
  $("[data-contato]").innerHTML = `<a href="mailto:${esc(P.contato)}">${esc(P.contato)}</a>`;

  render();
  carregarTitulos();
})();
</script>
</body>
</html>
